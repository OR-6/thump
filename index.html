<!doctype html>
<html lang="en">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preload" as="image" href="./site/hero.jpg" fetchpriority="high" />
    <style>
      /* Thump's site (docs/SITE-DESIGN.md). Every colour on the page comes from the properties on :root below: change
         the palette there and nothing else. The names are roles: plum = the page, ink = text, hot = the one action
         colour; the --i-* are the instruments' own colours in the desk drawing. */
      /* Atkinson Hyperlegible slashes its zero ("2Ø26"): the figures come from a plain sans instead (only 0–9) */
      @font-face { font-family: 'Figures'; font-weight: 400; unicode-range: U+0030-0039;
        src: local('Helvetica Neue'), local('HelveticaNeue'), local('Arial'), local('ArialMT'), local('Roboto'), local('Roboto-Regular'); }
      @font-face { font-family: 'Figures'; font-weight: 700; unicode-range: U+0030-0039;
        src: local('Helvetica Neue Bold'), local('HelveticaNeue-Bold'), local('Arial Bold'), local('Arial-BoldMT'), local('Roboto Bold'), local('Roboto-Bold'); }
      :root {
        /* the palette (roles) */
        --plum: #1d0b2c; --plum-2: #26103a; --line: #3d2357; --ink: #f6efe4; --ink-2: #b9aac9;
        --hot: #ff4b2b; --hot-ink: #1d0b2c;
        /* the instruments in the desk drawing, in their own colours (as the game paints them) */
        --i-edge: #1d0b2c;
        --i-head: #f3eee4; --i-shell: #d23d2b; --i-chrome: #d9d6df; --i-brass: #d2a54a; --i-groove: #9a7428;
        --i-key: #f6efe4; --i-bkey: #17111d; --i-case: #e0482d; --i-felt: #7a1f1a;
        --i-rosewood: #8e3a22; --i-rail: #6a5444;
        --i-skin: #ead6b0; --i-skin-line: #8b6a3e;
        --i-bronze: #a88a4e; --i-note: #8a6f39; --i-dimple: #5f4a22;
        --i-spruce: #e6c88f; --i-board: #3a2318; --i-rosette: #6b4a2a; --i-hole: #170c12; --i-string: #e9e3d6;
        --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        --body: 'Figures', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --t-hero: clamp(60px, 7.8vw, 124px); --t-1: clamp(48px, 6.4vw, 96px); --t-2: clamp(34px, 4.2vw, 60px);
        --t-3: clamp(26px, 2.6vw, 36px); --t-body: 19px; --t-small: 16px; --t-cap: 14px;
        --gut: 24px; --bar: 64px;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--plum); color: var(--ink); font-family: var(--body); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts; #landing-boot paints its top while the game loads: keep the two in step) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--plum); color: var(--ink);
        font: 400 var(--t-body)/1.55 var(--body); -webkit-font-smoothing: antialiased; }
      #landing[hidden] { display: none; }
      #landing [hidden] { display: none !important; }
      #landing *, #landing *::before, #landing *::after, #landing-boot * { box-sizing: border-box; }
      @media (prefers-reduced-motion: no-preference) { #landing { scroll-behavior: smooth; } }
      :where(#landing, #landing-boot) :where(p, h1, h2, h3, figure, ol, ul, dl, dd) { margin: 0; }
      :where(#landing, #landing-boot) :where(ol, ul) { padding: 0; list-style: none; }
      :where(#landing, #landing-boot) img { display: block; max-width: 100%; height: auto; }
      .wrap { max-width: calc(1180px + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
      .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--ink); color: var(--plum); padding: 12px 16px; font-weight: 700; }
      .skip:focus { top: 12px; }
      #landing a { color: inherit; }
      #landing .skip { color: var(--plum); }
      #landing main:focus { outline: none; }
      #landing :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      #landing section { scroll-margin-top: var(--bar); }
      .mark { display: block; }
      .mark .mark-ring { fill: none; stroke: var(--hot); }
      .mark .core { fill: var(--ink); }
      .nb { white-space: nowrap; }
      .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .hot { color: var(--hot); }

      /* small metadata: the body face, bold, small capitals with air (never the display face) */
      .nav a, .label, .meta-line, .eg-cap, .pick {
        font: 700 var(--t-cap)/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.1em; }

      /* the bar: transparent over the hero; plum with a 2px rule once the page scrolls */
      .bar { position: sticky; top: 0; z-index: 20; background: transparent; border-bottom: 2px solid transparent; transition: background-color 160ms, border-color 160ms; }
      .bar.scrolled { background: var(--plum); border-bottom-color: var(--line); }
      .bar-in { display: flex; align-items: center; gap: 40px; height: var(--bar); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
      .brand .mark { width: 24px; height: 24px; }
      .brand .wordmark-svg { width: 84px; height: auto; display: block; }
      .nav { display: flex; gap: 32px; margin-left: auto; }
      .nav a { text-decoration: none; color: var(--ink); padding: 8px 0; border-bottom: 2px solid transparent; }
      .nav a:hover { border-bottom-color: var(--hot); }

      /* buttons: square, upright; one hot primary */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 0 28px; border: 0; border-radius: 0;
        cursor: pointer; text-decoration: none; font: 900 22px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
      #landing .btn-1 { background: var(--hot); color: var(--hot-ink); }
      #landing .btn-1:hover { background: var(--ink); }
      #landing .btn-1:disabled { background: var(--line); color: var(--ink-2); cursor: default; }
      #landing .btn-2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
      #landing .btn-2:hover { background: var(--ink); color: var(--plum); }
      .btn-s { min-height: 40px; padding: 0 18px; font-size: 16px; }
      .bar .btn-s { margin-left: 0; }
      .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
        text-decoration: underline; text-decoration-color: var(--hot); text-decoration-thickness: 2px; text-underline-offset: 5px; }
      .link:hover { text-decoration-thickness: 4px; }

      .title { font: 900 var(--t-1)/0.9 var(--display); text-transform: uppercase; letter-spacing: -0.005em; }
      .h2 { font: 900 var(--t-2)/0.95 var(--display); text-transform: uppercase; }
      .h3 { font: 800 var(--t-3)/1.02 var(--display); text-transform: uppercase; letter-spacing: 0.005em; }
      .label { display: block; color: var(--ink-2); margin-bottom: 20px; }

      /* ---- the hero: the game being played, full bleed and muted; one line over it and one action ---- */
      .hero { position: relative; margin-top: calc(-1 * var(--bar)); min-height: clamp(600px, 92vh, 880px); display: flex; align-items: flex-end;
        padding: calc(var(--bar) + 48px) 0 72px; overflow: hidden; }
      /* (the loop sits right of the words, its left edge fading into the page) */
      .hero-media { position: absolute; inset: 0 0 0 22%; background: var(--plum); }
      .hero-video, .hero-media img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
      /* plum over the left (the words) and the bottom (into the page), the right left clear for the kit */
      .hero-media::after { content: ''; position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(90deg, var(--plum) 0%, color-mix(in srgb, var(--plum) 70%, transparent) 16%, color-mix(in srgb, var(--plum) 20%, transparent) 34%, transparent 48%),
          linear-gradient(0deg, var(--plum) 0%, color-mix(in srgb, var(--plum) 55%, transparent) 16%, transparent 34%),
          linear-gradient(180deg, color-mix(in srgb, var(--plum) 75%, transparent) 0%, transparent 16%); }
      .hero-in { position: relative; z-index: 1; width: 100%; }
      #landing h1, #landing-boot h1 { font: 900 var(--t-hero)/0.86 var(--display); text-transform: uppercase; letter-spacing: -0.01em; max-width: 5.3em; color: var(--ink); }
      .tag { font: 700 clamp(21px, 1.9vw, 27px)/1.3 var(--body); margin-top: 24px; max-width: 21em; }
      .cta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 36px; }
      .addr { margin-top: 28px; font: 700 var(--t-small)/1.3 var(--body); color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.1em; }
      .addr-url { display: block; margin-top: 6px; font: 900 clamp(34px, 3.6vw, 52px)/1 var(--display); letter-spacing: 0.01em; text-transform: none; color: var(--ink);
        background: none; border: 0; padding: 0 0 4px; cursor: copy; text-decoration: underline; text-decoration-color: var(--hot); text-decoration-thickness: 4px; text-underline-offset: 8px; }
      .addr-url:hover { text-decoration-thickness: 7px; }
      .go-note { font-size: var(--t-small); line-height: 1.45; color: var(--ink); margin-top: 14px; max-width: 30em; min-height: 1.45em; }
      .xr-fail { color: var(--hot); font-weight: 700; margin-top: 12px; }
      #landing[data-where='xr'] .go-note { margin-top: 18px; }

      /* the full stop is the hit: a ring closes onto it over two beats (96 bpm) and bursts as it lands */
      .beat { position: relative; display: inline-block; width: 0.17em; height: 0.17em; margin-left: 0.05em; vertical-align: baseline; }
      .beat::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--ink); }
      .beat-ring { position: absolute; left: 50%; top: 50%; width: 0.62em; height: 0.62em; margin: -0.31em 0 0 -0.31em; overflow: visible; pointer-events: none; }
      .beat-ring circle { fill: none; stroke: var(--hot); stroke-width: 7; opacity: 0; transform-box: fill-box; transform-origin: center; }
      .beat-ring .burst { stroke-width: 5; }
      @media (prefers-reduced-motion: no-preference) {
        .beat::before { animation: thump 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s infinite; }
        .beat-ring .closing { animation: closing 2.5s linear 0.6s infinite; }
        .beat-ring .burst { animation: burst 2.5s cubic-bezier(0.1, 0.7, 0.3, 1) 0.6s infinite; }
      }
      @keyframes closing { 0% { transform: scale(2.4) rotate(-20deg); opacity: 0; } 12% { opacity: 1; } 50% { transform: scale(1) rotate(0deg); opacity: 1; } 51%, 100% { transform: scale(1); opacity: 0; } }
      @keyframes burst { 0%, 49.9% { transform: scale(1); opacity: 0; } 50% { transform: scale(1); opacity: 1; } 70%, 100% { transform: scale(2.3); opacity: 0; } }
      @keyframes thump { 0%, 49.9% { transform: none; background: var(--ink); } 50% { transform: scale(1.45); background: var(--hot); } 64%, 100% { transform: none; background: var(--ink); } }

      /* ---- the six, as big pictures ---- */
      .pics { padding-top: 88px; }
      .mosaic { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px 24px; }
      .pic figure { margin: 0; }
      .pic img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: var(--plum-2); }
      .pic figcaption { margin-top: 14px; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); max-width: 34em; }
      .pic figcaption strong { display: block; font: 900 var(--t-3)/1 var(--display); text-transform: uppercase; color: var(--ink); letter-spacing: 0.01em; margin-bottom: 4px; }
      .pic-1 { grid-column: 1 / span 7; }
      .pic-2 { grid-column: 8 / span 5; align-self: end; }
      .pic-3 { grid-column: 1 / span 5; }
      .pic-4 { grid-column: 6 / span 7; }
      .pic-5 { grid-column: 1 / span 6; }
      .pic-6 { grid-column: 7 / span 6; }

      /* ---- the desk drawing: plays itself as it scrolls in, then plays under your hands ---- */
      .play { padding-top: 136px; }
      .play-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 32px; }
      .play-head p { color: var(--ink-2); font-size: var(--t-small); }
      .picker { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 16px; }
      .pick { background: transparent; color: var(--ink); border: 0; box-shadow: inset 0 0 0 2px var(--line); padding: 12px 18px; min-height: 48px; cursor: pointer; }
      .pick:hover { box-shadow: inset 0 0 0 2px var(--ink-2); }
      .pick[aria-pressed='true'] { background: var(--ink); color: var(--plum); box-shadow: none; }
      .desk { margin: 0; }
      .stage { position: relative; background: var(--plum-2); touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .desk-svg { display: block; width: 100%; height: auto; max-height: 72vh; }
      .desk-svg [class^='m-'] { stroke: var(--i-edge); stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
      .desk-svg .m-head { fill: var(--i-head); } .desk-svg .m-shell { fill: var(--i-shell); } .desk-svg .m-chrome { fill: var(--i-chrome); }
      .desk-svg .m-brass { fill: var(--i-brass); } .desk-svg .m-groove { fill: none; stroke: var(--i-groove); }
      .desk-svg .m-key { fill: var(--i-key); } .desk-svg .m-bkey { fill: var(--i-bkey); } .desk-svg .m-case { fill: var(--i-case); }
      .desk-svg .m-felt { fill: none; stroke: var(--i-felt); stroke-width: 5px; }
      .desk-svg .m-rosewood { fill: var(--i-rosewood); } .desk-svg .m-rail { fill: none; stroke: var(--i-rail); stroke-width: 7px; }
      .desk-svg .m-skin { fill: var(--i-skin); } .desk-svg .m-dash { fill: none; stroke: var(--i-skin-line); stroke-dasharray: 0.9 0.9; }
      .desk-svg .m-bronze { fill: var(--i-bronze); } .desk-svg .m-note { fill: var(--i-note); } .desk-svg .m-dimple { fill: none; stroke: var(--i-dimple); }
      .desk-svg .m-spruce { fill: var(--i-spruce); } .desk-svg .m-board { fill: var(--i-board); } .desk-svg .m-rosette { fill: none; stroke: var(--i-rosette); stroke-width: 4px; }
      .desk-svg .m-hole { fill: var(--i-hole); } .desk-svg .m-fret { fill: none; stroke: var(--i-chrome); stroke-width: 1px; }
      .desk-svg .m-string { fill: none; stroke: var(--i-string); stroke-width: 1px; } .desk-svg .m-string.wound { stroke-width: 2px; }
      .desk-svg .held { fill: var(--hot); stroke: var(--i-edge); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .stage.unfold .inst-pos > .inst { animation: unfold 260ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      .part { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--hot); fill-opacity: 0; stroke: none; pointer-events: none; }
      .part .glow > .band { fill: none; stroke: var(--hot); stroke-opacity: 0; }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill-opacity: 0.6; stroke-opacity: 0.6; } to { fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { stroke: var(--ink); stroke-opacity: 1; stroke-width: 3px; vector-effect: non-scaling-stroke; }
      .part:focus-visible .glow > .band { stroke-width: 3px; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      /* the ring closing onto what's next (the shape of the part: round for a drum, square for a key) */
      .close-ring { position: absolute; pointer-events: none; border: 3px solid var(--hot); animation: close-in linear forwards; }
      .close-ring.round { border-radius: 50%; }
      @keyframes close-in { from { transform: scale(1.9); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
      /* the hit: a broken hot ring goes out from the point you hit, once */
      .hit-ring { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; pointer-events: none; animation: ring 420ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
      .hit-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .hit-ring circle { fill: none; stroke: var(--hot); }
      @keyframes ring { from { transform: scale(0.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .about { margin-top: 14px; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); min-height: 1.45em; }

      /* ---- lessons and grades: the picture leads, a line beside it ---- */
      .learn { padding-top: 136px; }
      .row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 48px; align-items: center; }
      .row + .row { margin-top: 72px; }
      .row-b { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
      .row-b .row-pic { order: 2; }
      .row-pic { margin: 0; }
      .row-pic img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; }
      .row-words p { margin-top: 18px; color: var(--ink-2); max-width: 26em; }
      .row-words strong { color: var(--ink); }

      /* ---- the setlist: a dense poster on its own field, originals first ---- */
      .setlist { margin-top: 152px; background: var(--plum-2); padding: 96px 0 104px; }
      .set-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 48px; border-bottom: 3px solid var(--ink); padding-bottom: 20px; }
      .mega { font-size: clamp(88px, 13vw, 196px); line-height: 0.8; margin-left: -0.03em; white-space: nowrap; }
      .set-note { color: var(--ink); max-width: 19em; padding-bottom: 6px; }
      .songs { columns: 3 300px; column-gap: 40px; margin-top: 28px; }
      .song { break-inside: avoid; padding: 10px 0 9px; border-bottom: 2px solid var(--line); }
      .song .name { display: block; font: 800 clamp(24px, 2.2vw, 30px)/1 var(--display); text-transform: uppercase; letter-spacing: 0.01em; }
      .meta-line { display: block; margin-top: 4px; color: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
      .lessons { margin-top: 32px; color: var(--ink-2); font-size: var(--t-small); }

      /* ---- play together: the one hot field, all type in plum ---- */
      .together { background: var(--hot); color: var(--hot-ink); padding: 88px 0 96px; }
      .together .label { color: var(--hot-ink); }
      #landing .together :focus-visible { outline-color: var(--hot-ink); }
      .together-in { display: grid; grid-template-columns: minmax(0, 8fr) minmax(0, 4fr); gap: 40px; align-items: end; }
      .together .title { color: var(--hot-ink); max-width: 9em; }
      .together-words .big { font: 700 clamp(21px, 1.9vw, 26px)/1.3 var(--body); margin-top: 24px; max-width: 22em; }
      .eg { justify-self: end; display: flex; align-items: baseline; gap: 12px; }
      .eg-code { font: 900 clamp(84px, 11vw, 168px)/0.8 var(--display); letter-spacing: 0.04em; color: var(--hot-ink); }
      .band-ctl { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); margin-top: 56px; border-top: 3px solid var(--hot-ink); }
      .band-ctl > div { padding: 28px 0 0; }
      .band-ctl > div + div { border-left: 3px solid var(--hot-ink); padding-left: 40px; }
      .band-ctl h3 { font: 800 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 6px; }
      .band-ctl .hint { font-size: var(--t-small); margin-bottom: 20px; max-width: 22em; }
      #landing .together .btn-1 { background: var(--hot-ink); color: var(--ink); }
      #landing .together .btn-1:hover { background: var(--plum-2); }
      #landing .together .btn-2 { color: var(--hot-ink); box-shadow: inset 0 0 0 3px var(--hot-ink); }
      #landing .together .btn-2:hover { background: var(--hot-ink); color: var(--ink); }
      .join { display: flex; gap: 20px; align-items: flex-end; }
      .field { display: grid; gap: 4px; flex: 0 1 260px; min-width: 0; }
      .field label { font: 800 26px/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
      #band-code { width: 100%; font: 900 48px/1 var(--display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--hot-ink); caret-color: var(--hot-ink);
        background: transparent; border: 0; border-bottom: 3px solid var(--hot-ink); border-radius: 0; padding: 6px 0 4px; min-height: 64px; }
      #landing #band-code:focus-visible { outline: none; border-bottom-width: 6px; padding-bottom: 1px; background: color-mix(in srgb, var(--hot-ink) 8%, transparent); }
      #band-status { min-height: 1.6em; font-weight: 700; margin-top: 24px; }

      /* ---- settings ---- */
      .prep-sec { padding-top: 72px; }
      details.prep { border-bottom: 2px solid var(--line); }
      details.prep summary { list-style: none; display: flex; align-items: center; gap: 16px; cursor: pointer; padding: 16px 0; border-top: 2px solid var(--line);
        font: 800 26px/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
      details.prep summary::-webkit-details-marker { display: none; }
      details.prep summary small { font: 400 var(--t-small)/1.4 var(--body); text-transform: none; letter-spacing: 0; color: var(--ink-2); }
      /* the marker: a plus in a square, a minus when open */
      .pm { position: relative; flex: none; width: 28px; height: 28px; margin-left: auto; box-shadow: inset 0 0 0 2px var(--ink); }
      .pm::before, .pm::after { content: ''; position: absolute; left: 7px; right: 7px; top: 13px; height: 2px; background: var(--ink); }
      .pm::after { transform: rotate(90deg); }
      details.prep[open] .pm::after { display: none; }
      details.prep summary:hover .pm { background: var(--ink); }
      details.prep summary:hover .pm::before, details.prep summary:hover .pm::after { background: var(--plum); }
      .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 40px; margin: 8px 0 24px; font-size: var(--t-small); align-items: start; }
      .opts label { display: flex; gap: 10px; align-items: center; }
      .opts label.sel { flex-direction: column; align-items: flex-start; gap: 6px; }
      .range { display: flex; gap: 10px; align-items: center; }
      .opts input[type='checkbox'] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--hot); }
      .opts input[type='range'] { accent-color: var(--hot); width: 170px; }
      .opts select { font: inherit; color: var(--ink); background: var(--plum-2); border: 2px solid var(--line); border-radius: 0; padding: 8px; max-width: 100%; }
      .small-print { font-size: 15px; color: var(--ink-2); margin: 4px 0 24px; }

      /* ---- footer: who made it, what it runs on, the credits ---- */
      .foot { margin-top: 96px; background: var(--plum-2); padding: 56px 0 64px; font-size: var(--t-small); line-height: 1.5; color: var(--ink-2); }
      .foot-in { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: start; }
      .foot-maker .wordmark-svg { width: 160px; height: auto; display: block; color: var(--ink); margin-bottom: 20px; }
      .maker { font: 700 21px/1.35 var(--body); color: var(--ink); max-width: 18em; }
      .foot-text p + p { margin-top: 12px; }
      .foot-text .specs { color: var(--ink); }

      @media (max-width: 1060px) {
        .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      /* tablet and phone: the loop first, on its own, then the line and the one button */
      @media (max-width: 900px) {
        :root { --gut: 16px; --bar: 56px; }
        .nav { display: none; }
        .bar-in { justify-content: space-between; }
        .hero { display: block; min-height: 0; padding: 0 0 48px; }
        .hero-media { position: relative; inset: auto; aspect-ratio: 16 / 10; max-height: 70vh; width: 100%; }
        .hero-video, .hero-media img { object-position: 62% 50%; }
        .hero-media::after { background: linear-gradient(0deg, var(--plum) 0%, transparent 26%), linear-gradient(180deg, color-mix(in srgb, var(--plum) 80%, transparent) 0%, transparent 24%); }
        .hero-in { margin-top: 8px; }
        #landing h1, #landing-boot h1 { max-width: none; }
        .pics { padding-top: 72px; }
        .mosaic { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px 16px; }
        .pic-1, .pic-2 { grid-column: 1 / -1; }
        .pic-3, .pic-4, .pic-5, .pic-6 { grid-column: auto; }
        .play, .learn { padding-top: 96px; }
        .row, .row-b { grid-template-columns: minmax(0, 1fr); gap: 20px; }
        .row-b .row-pic { order: 0; }
        .row + .row { margin-top: 56px; }
        .setlist { margin-top: 104px; padding: 64px 0 72px; }
        .together { padding: 64px 0 72px; }
        .together-in { grid-template-columns: minmax(0, 1fr); }
        .eg { justify-self: start; }
        .band-ctl { grid-template-columns: minmax(0, 1fr); margin-top: 40px; }
        .band-ctl > div + div { border-left: 0; padding-left: 0; border-top: 3px solid var(--hot-ink); margin-top: 32px; }
        .opts { grid-template-columns: minmax(0, 1fr); }
        .foot-in { grid-template-columns: minmax(0, 1fr); gap: 28px; }
      }
      @media (max-width: 599px) {
        .btn { padding: 0 22px; font-size: 20px; }
        .cta .btn { flex: 1 1 100%; }
        .hero-media { aspect-ratio: 4 / 3; }
        .mosaic { grid-template-columns: minmax(0, 1fr); }
        .pic-1, .pic-2, .pic-3, .pic-4, .pic-5, .pic-6 { grid-column: 1 / -1; }
        .picker { gap: 6px; }
        .pick { padding: 10px 12px; }
        .join { gap: 16px; }
        .field { flex: 1 1 auto; }
        details.prep summary { flex-wrap: wrap; row-gap: 4px; }
        details.prep summary small { order: 3; flex-basis: 100%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage.unfold .inst-pos > .inst { animation: none; }
        .part.lit .glow > * { animation-duration: 1ms; }
        .hit-ring { animation: ring-still 400ms linear forwards; }
        .bar { transition: none; }
      }
      @keyframes ring-still { from { opacity: 1; } to { opacity: 0; } }

      /* the phone jam page (src/jam/phone.ts) */
      .jam { margin-top: 24px; border-top: 2px solid var(--line); padding-top: 16px; }
      .jam h2 { font: 800 24px/1.1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
      .jam-lede { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 900 22px var(--display); letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px; background: var(--plum-2); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; }
      .jam-status { color: var(--ink-2); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: var(--line); margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: var(--hot); } to { background: var(--line); } }
      .jam-song { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 2px solid var(--hot); border-radius: 50%; background: var(--plum-2); color: var(--ink); font: 700 16px var(--body); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { border-width: 4px; }
    </style>
  </head>

      <section class="hero">
        <div class="hero-media"><img src="./site/hero.jpg" width="1280" height="720" alt="" /></div>

          <h1>A band on your desk<span class="beat" aria-hidden="true"></span></h1>

    <script>
      // the browser's own chrome in the page's colour, from the palette above
      document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--plum').trim();

    <script type="module" src="/src/index.ts"></script>
