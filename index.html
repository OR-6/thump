<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Thump: your desk is a drum machine. A mixed-reality music game for Meta Quest 3. Hit your desk, your mug and your books, then build a track." />
    <meta property="og:title" content="Thump: your desk is a drum machine" />
    <meta property="og:description" content="Hit your desk, your mug, your knee. Each one plays." />
    <meta property="og:url" content="https://or-6.github.io/thump/" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Thump</title>
    <style>
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url(./fonts/BarlowCondensed-SemiBold.ttf) format('truetype'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url(./fonts/BarlowCondensed-Bold.ttf) format('truetype'); }
      :root {
        --bg: #0d0d0f; --panel: #151518; --edge: #26262b; --ink: #f2efe6; --soft: #a8a49b; --dim: #6c6a65;
        --accent: #ff5a3c; --accent-deep: #c9402a;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
      #scene-container { position: fixed; inset: 0; }
      @font-face { font-family: 'Permanent Marker'; font-display: swap; src: url(./fonts/PermanentMarker-Regular.ttf) format('truetype'); }
      /* a desk sampler: matte black, a mono LCD, rubber pads with LED rings, tape labels in marker */
      #landing { position: fixed; inset: 0; overflow: auto; padding: 48px 20px; box-sizing: border-box; background: #1d1c1a radial-gradient(900px 500px at 30% 0%, #2a2825, #1d1c1a); }
      #landing[hidden] { display: none; }
      #landing *, #landing *::before, #landing *::after { box-sizing: border-box; }
      .rig { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 48px; align-items: start; }
      .sampler { background: linear-gradient(#1b1b1d, #141416); border-radius: 12px; padding: 18px 20px 22px; box-shadow: inset 0 1px 0 #ffffff14, inset 0 -2px 0 #0008, 0 24px 50px #000a, 0 2px 0 #000; }
      .top { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 12px; }
      .brand { font: 700 26px 'Barlow Condensed', var(--sans); letter-spacing: 4px; color: #ece6d8; }
      .model { font: 600 11px 'Barlow Condensed', var(--sans); letter-spacing: 2px; color: #77736b; }
      .lcd { background: #1f2a22; border-radius: 4px; padding: 12px 14px; margin-bottom: 18px; box-shadow: inset 0 2px 6px #000c; display: flex; flex-direction: column; gap: 2px; min-height: 66px; }
      .lcd-main { font: 600 22px 'Barlow Condensed', var(--sans); letter-spacing: 1.5px; color: #b6f0c4; text-shadow: 0 0 8px #7fe39a55; font-variant-numeric: tabular-nums; }
      .lcd-sub { font: 500 14px 'Barlow Condensed', var(--sans); letter-spacing: 1px; color: #6fae80; }
      .pads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
      .pad { position: relative; aspect-ratio: 1; border: 0; border-radius: 7px; cursor: pointer; padding: 0;
        background: radial-gradient(circle at 50% 40%, #3a3a3e, #2a2a2d 70%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent), inset 0 -3px 0 #0006, 0 2px 0 #000; transition: transform 60ms; }
      .pad:active { transform: translateY(1px); }
      .pad.hit { animation: led 380ms ease-out; }
      @keyframes led { from { box-shadow: inset 0 0 0 3px var(--c), 0 0 22px var(--c), inset 0 0 26px color-mix(in srgb, var(--c) 50%, transparent); } to { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--c) 45%, transparent), inset 0 -3px 0 #0006, 0 2px 0 #000; } }
      .pad i { position: absolute; left: 6px; right: 6px; top: -9px; font: 400 12px 'Permanent Marker', sans-serif; font-style: normal; color: #1a1712; background: #ece2c6; padding: 3px 4px 2px; transform: rotate(-1.5deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        clip-path: polygon(0 8%, 3% 0, 100% 4%, 98% 50%, 100% 96%, 2% 100%, 0 60%); }
      .pad:nth-child(3n) i { transform: rotate(1.2deg); }
      .pad:nth-child(4n+1) i { transform: rotate(-0.4deg); }
      .pad:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
      .go { margin-top: 20px; }
      .power { display: flex; align-items: center; gap: 12px; width: 100%; justify-content: center; font: 700 20px 'Barlow Condensed', var(--sans); letter-spacing: 2px; text-transform: uppercase; color: #ece6d8;
        background: linear-gradient(#2c2c30, #222225); border: 0; border-radius: 8px; padding: 16px 20px; cursor: pointer; box-shadow: inset 0 1px 0 #ffffff1a, inset 0 -3px 0 #0007, 0 2px 0 #000; }
      .power:hover { background: linear-gradient(#323236, #26262a); }
      .power:active { transform: translateY(1px); }
      .power:focus-visible { outline: 2px solid #b6f0c4; outline-offset: 3px; }
      .power .led { width: 10px; height: 10px; border-radius: 50%; background: #ff5a3c; box-shadow: 0 0 10px #ff5a3c; }
      .power.small { font-size: 15px; padding: 10px 16px; width: auto; }
      .manual { padding-top: 26px; color: #d8d2c4; font: 400 17px/1.6 var(--sans); max-width: 440px; }
      .manual p { margin: 0 0 14px; }
      .note { font-size: 14px; color: #a39d8f; margin: 14px 0 0; line-height: 1.5; }
      .xr-fail { color: #ff8f7a; margin: 12px 0 0; }
      .quest { font-size: 17px; line-height: 1.55; margin: 0 0 14px; color: #ece6d8; }
      .url { font-family: ui-monospace, Menlo, monospace; color: #fbf3e2; border-bottom: 1px dashed #a39d8f; }
      details.prep { margin-top: 36px; border-top: 1px solid #ffffff1a; padding-top: 14px; }
      details.prep summary { font-size: 15px; color: #d8d2c4; cursor: pointer; }
      .opts { display: grid; gap: 11px; margin-top: 14px; font-size: 15px; color: #d8d2c4; }
      .opts label { display: flex; gap: 10px; align-items: center; }
      .opts input[type='checkbox'] { width: 18px; height: 18px; accent-color: #c8341f; }
      .opts select, .opts input[type='range'] { font: inherit; accent-color: #c8341f; }
      .opts select { background: #23221f; color: #ece6d8; border: 1px solid #ffffff22; border-radius: 3px; padding: 4px 6px; }
      .small-print { font-size: 13px; color: #8f897c; margin: 4px 0 0; }
      .link { font: inherit; color: #ff8f7a; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
      .foot { margin-top: 28px; font-size: 12px; color: #8f897c; }
      .jam { margin-top: 26px; border-top: 1px solid var(--edge); padding-top: 18px; }
      .jam h2 { font-size: 18px; margin: 0 0 6px; }
      .jam-lede { color: var(--soft); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 600 22px ui-monospace, Menlo, monospace; letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px;
        background: #0e0e10; color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; }
      .jam-status { color: var(--soft); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: #2a2a2e; margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: #2ad1b5; box-shadow: 0 0 18px #2ad1b5; } to { background: #2a2a2e; box-shadow: none; } }
      .jam-song { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2c2c31, #141417); color: var(--soft);
        box-shadow: inset 0 0 0 3px #26262b, 0 0 0 2px #2ad1b5; font: 600 16px var(--sans); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { box-shadow: inset 0 0 0 3px #26262b, 0 0 0 4px #2ad1b5, 0 0 24px #2ad1b5; }
      @media (max-width: 820px) {
        #landing { padding: 24px 14px; }
        .rig { grid-template-columns: 1fr; gap: 20px; }
        .pads { gap: 9px; }
        .pad i { font-size: 10px; }
        .manual { padding-top: 0; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
