<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thump: a band on your desk</title>
    <meta name="description" content="Thump is a mixed-reality music game for Meta Quest 3, played sitting at a desk with your bare hands. Drums, keys, guitar, marimba, congas and a handpan; 19 songs on Easy, Normal and Hard; up to four players. Free, in the Quest browser." />
    <meta name="theme-color" content="#1d0b2c" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Thump" />
    <meta property="og:title" content="Thump: a band on your desk" />
    <meta property="og:description" content="A mixed-reality music game for Meta Quest 3. Drums, keys, guitar and more, played with your bare hands at your desk. Free, in the browser." />

    <meta name="twitter:title" content="Thump: a band on your desk" />
    <meta name="twitter:description" content="A mixed-reality music game for Meta Quest 3, played with your bare hands. Free, in the browser." />
    <meta name="twitter:image" content="https://or-6.github.io/thump/site/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800;900&display=swap" />
    <style>
      /* Thump's site: the hit (docs/SITE-DESIGN.md). Deep plum, off-white type, one hot red-orange, broken rings. Flat. */
      :root {
        --plum: #1d0b2c; --plum-2: #26103a; --line: #3d2357; --ink: #f6efe4; --ink-2: #b9aac9;
        --hot: #ff4b2b; --hot-ink: #1d0b2c; --easy: #3ddc97; --normal: #ffc93c; --hard: #ff4b2b;
        --tray: #26103a; --tray-lip: #3d2357;
        --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        --body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --t-mega: clamp(96px, 15vw, 220px); --t-1: clamp(52px, 7vw, 104px); --t-2: clamp(32px, 4vw, 56px);
        --t-3: 26px; --t-body: 19px; --t-small: 16px; --t-cap: 14px;
        --gut: 24px; --sec: 144px; --bar: 64px;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--plum); color: var(--ink); font-family: var(--body); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts; #landing-boot paints its top while the game loads: keep the two in step) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--plum); color: var(--ink);
        font: 400 var(--t-body)/1.55 var(--body); -webkit-font-smoothing: antialiased; }
      #landing[hidden] { display: none; }
      #landing [hidden] { display: none !important; }
      #landing *, #landing *::before, #landing *::after, #landing-boot * { box-sizing: border-box; }
      @media (prefers-reduced-motion: no-preference) { #landing { scroll-behavior: smooth; } }
      :where(#landing, #landing-boot) :where(p, h1, h2, h3, figure, ol, ul, dl, dd) { margin: 0; }
      :where(#landing) :where(ol, ul) { padding: 0; list-style: none; }
      :where(#landing) img { display: block; max-width: 100%; height: auto; }
      .wrap { max-width: calc(1180px + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
      .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--ink); color: var(--plum); padding: 12px 16px; font-weight: 700; }
      .skip:focus { top: 12px; }
      #landing a { color: inherit; }
      #landing main:focus { outline: none; }
      #landing :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      #landing section { scroll-margin-top: var(--bar); }
      .mark { display: block; }

      /* the bar: the mark and the wordmark small at the left, capital links and a small Enter at the right */
      .bar { position: sticky; top: 0; z-index: 20; background: var(--plum); border-bottom: 2px solid transparent; transition: border-color 160ms; }
      .bar.scrolled { border-bottom-color: var(--line); }
      .bar-in { display: flex; align-items: center; gap: 40px; height: var(--bar); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
      .brand .mark { width: 24px; height: 24px; }
      .brand .wordmark-svg { width: 84px; height: auto; display: block; }
      .nav { display: flex; gap: 32px; margin-left: auto; }
      .nav a, .kicker, .cap-src, .group, .bpm, .spec dt, .desk-foot, .pick, .seats text {
        font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; }
      .nav a { font-size: var(--t-cap); line-height: 1.2; text-decoration: none; color: var(--ink); padding: 8px 0; border-bottom: 2px solid transparent; }
      .nav a:hover { border-bottom-color: var(--hot); }

      /* buttons: square, upright; one hot primary */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 0 28px; border: 0; border-radius: 0;
        cursor: pointer; text-decoration: none; font: 900 22px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
      #landing .btn-1 { background: var(--hot); color: var(--hot-ink); }
      #landing .btn-1:hover { background: var(--ink); }
      #landing .btn-1:disabled { background: var(--line); color: var(--ink-2); cursor: default; }
      #landing .btn-2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
      #landing .btn-2:hover { background: var(--ink); color: var(--plum); }
      .btn-s { min-height: 40px; padding: 0 18px; font-size: 16px; }
      .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
        text-decoration: underline; text-decoration-color: var(--hot); text-decoration-thickness: 2px; text-underline-offset: 5px; }
      .link:hover, .foot a:hover { text-decoration-thickness: 4px; }

      /* a section's label: the small mark beside a capital word */
      .kicker { display: flex; align-items: center; gap: 12px; font-size: var(--t-cap); line-height: 1.2; color: var(--ink); }
      .kicker .mark { width: 24px; height: 24px; flex: none; }
      .title { font: 900 var(--t-1)/0.9 var(--display); text-transform: uppercase; letter-spacing: -0.005em; margin-top: 24px; }
      .title > span { display: block; text-wrap: balance; }
      .nb { white-space: nowrap; }
      .sec { position: relative; padding: var(--sec) 0 0; overflow: clip; }
      .bg-arc { position: absolute; pointer-events: none; width: 1100px; height: 1100px; }
      .bg-arc circle { stroke: var(--line); stroke-width: 2px; vector-effect: non-scaling-stroke; }

      /* the hero: the wordmark huge in ink, the line, the button; the mark turning off the right edge */
      .hero { position: relative; overflow: clip; }
      .hero-top { position: relative; overflow: clip; padding: 64px 0 112px; }
      .hero-mark { position: absolute; width: min(1180px, 84vw); height: auto; aspect-ratio: 1; right: calc(min(1180px, 84vw) * -0.4); top: -4vw; }
      .hero-mark .ring { transform-box: fill-box; transform-origin: center; }
      .hero-in { position: relative; }
      .hero-word { width: min(760px, 62%); margin-left: -1.2%; color: var(--ink); }
      .hero-word .wordmark-svg { display: block; width: 100%; height: auto; }
      #landing h1, #landing-boot h1 { font: 900 clamp(44px, 5.6vw, 80px)/0.92 var(--display); text-transform: uppercase; margin: 40px 0 24px; max-width: 9em; }
      .lede { max-width: 29em; color: var(--ink); }
      .cta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
      .go-note { font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); margin-top: 16px; max-width: 34em; }
      .xr-fail { color: var(--hot); font-weight: 700; margin-top: 12px; }
      /* the captures under it: one row at one height, running off the right edge */
      .strip { display: flex; gap: 16px; margin: 0 calc(50% - 50vw) 0 0; }
      .cap { flex: var(--ar) 1 0; min-width: 0; }
      .cap img { width: 100%; aspect-ratio: var(--ar); object-fit: cover; border: 2px solid var(--line); }
      .cap figcaption, .shot figcaption, .cap-src { font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); margin-top: 12px; }
      .cap figcaption { font-size: 14px; }

      @media (prefers-reduced-motion: no-preference) {
        .hero-mark { animation: hit 1100ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        .hero-mark .ring-1 { animation: turn 48s linear infinite; }
        .hero-mark .ring-2 { animation: turn 72s linear infinite reverse; }
        .hero-mark .ring-3 { animation: turn 90s linear infinite; }
      }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes hit { 0% { transform: scale(0.9); opacity: 0; } 45% { transform: scale(1.025); opacity: 1; } 100% { transform: none; opacity: 1; } }

      /* the band: six names as big type; the chosen one swaps the capture */
      .arc-band { left: -1000px; top: 0; }
      .band-in { position: relative; display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: 64px; align-items: start; }
      .inst-list { margin-top: 32px; border-top: 2px solid var(--line); }
      .inst-list li { border-bottom: 2px solid var(--line); }
      .member { display: flex; align-items: center; gap: 0; width: 100%; background: none; border: 0; padding: 10px 0 6px; cursor: pointer; text-align: left;
        font: 900 var(--t-2)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.01em; color: var(--ink-2); }
      .member .mark { width: 0; height: 0.62em; flex: none; opacity: 0; transition: width 160ms, margin 160ms, opacity 160ms; }
      .member small { margin-left: auto; padding-left: 16px; font: 800 var(--t-cap)/1.2 var(--display); letter-spacing: 0.14em; color: var(--ink-2); }
      .member:hover { color: var(--ink); }
      .member[aria-pressed='true'] { color: var(--ink); }
      .member[aria-pressed='true'] .mark { width: 0.62em; margin-right: 0.28em; opacity: 1; }
      .band-shot { position: sticky; top: calc(var(--bar) + 32px); padding-top: 56px; }
      .band-shot img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border: 2px solid var(--line); }
      .band-shot figcaption { display: block; }
      .band-shot .cap-src { display: block; font-size: 13px; letter-spacing: 0.14em; margin-top: 16px; }
      .how { display: block; font-size: 22px; line-height: 1.4; color: var(--ink); margin: 12px 0 16px; max-width: 26em; min-height: 2.8em; }

      /* hear them now: the desk drawing in a plain frame */
      .hear-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 64px; align-items: start; }
      .hear-words p { color: var(--ink); margin-top: 24px; max-width: 24em; }
      .picker { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-top: 32px; }
      .pick { font-size: 22px; line-height: 1; letter-spacing: 0.06em; color: var(--ink-2); background: none; border: 0; padding: 8px 0; cursor: pointer;
        border-bottom: 2px solid transparent; }
      .pick:hover { color: var(--ink); }
      .pick[aria-pressed='true'] { color: var(--ink); border-bottom-color: var(--hot); }
      .frame { border: 2px solid var(--line); padding: 16px; }
      .stage { position: relative; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .desk-svg { display: block; width: 100%; height: auto; }
      .stage.unfold .inst-pos > .inst { animation: unfold 260ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      .part { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--hot); fill-opacity: 0; stroke: var(--hot); stroke-opacity: 0; pointer-events: none; }
      .part .glow > :not([fill='none']) { stroke-width: 0.35; }
      .part .glow > [fill='none'] { fill: none; }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill-opacity: 0.7; stroke-opacity: 0.9; } to { fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { stroke: var(--ink); stroke-opacity: 1; stroke-width: 0.45; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      .hit-ring { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; pointer-events: none; animation: ring 400ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
      .hit-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .hit-ring circle { fill: none; stroke: var(--hot); stroke-width: 5; stroke-dasharray: 150 40 60 26; }
      @keyframes ring { from { transform: scale(0.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .desk-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
      .scale { display: flex; align-items: center; gap: 8px; flex: 0 0 40%; justify-content: flex-end; }
      .scale-bar { display: block; height: 7px; border: 2px solid var(--ink-2); border-top: 0; flex: none; }
      .about { margin-top: 16px; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); max-width: 40em; }

      /* the setlist: big type rows, like a tour list */
      .arc-set { right: -1010px; top: 120px; }
      .setlist .wrap { position: relative; }
      .group { display: flex; align-items: baseline; gap: 12px; font-size: var(--t-cap); color: var(--ink); margin: 72px 0 0; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
      .group span { color: var(--ink-2); }
      .songs { counter-reset: none; }
      .song { display: grid; grid-template-columns: 64px minmax(0, 1fr) 200px 96px 212px; align-items: center; column-gap: 16px; padding: 14px 0 12px; border-bottom: 2px solid var(--line); }
      .song:hover { background: var(--plum-2); }
      .no { position: relative; display: block; width: 28px; height: 28px; font: 800 15px/28px var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }
      .no .mark { position: absolute; inset: 0; width: 28px; height: 28px; opacity: 0; }
      .song:hover .no > span { opacity: 0; }
      .song:hover .no .mark { opacity: 1; }
      .name { font: 800 var(--t-2)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.005em; }
      .by { font-size: var(--t-small); color: var(--ink-2); }
      .bpm { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
      .lv { display: flex; gap: 6px; justify-content: flex-end; }
      .lv i { font: 800 13px/1 var(--display); font-style: normal; letter-spacing: 0.1em; text-transform: uppercase; color: var(--hot-ink); padding: 6px 8px 5px; }
      .lv .e { background: var(--easy); } .lv .n { background: var(--normal); } .lv .h { background: var(--hard); }
      .lessons { margin-top: 40px; max-width: 46em; color: var(--ink-2); }
      .lessons strong { display: block; font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); margin-bottom: 8px; }

      /* go for the S */
      .score-in { margin-top: 56px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 64px; align-items: start; }
      .rules { counter-reset: rule; border-top: 2px solid var(--line); }
      .rules li { counter-increment: rule; display: grid; grid-template-columns: 48px minmax(0, 1fr); column-gap: 8px; padding: 18px 0 16px; border-bottom: 2px solid var(--line); }
      .rules li::before { content: counter(rule); grid-row: span 2; font: 900 var(--t-3)/1.15 var(--display); color: var(--ink-2); }
      .rules strong { display: block; font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 4px; }
      .shots { padding-top: 0; }
      .shot img { width: 100%; border: 2px solid var(--line); }
      .shot-b { margin-top: 64px; }

      /* play together: the code, and four seats round the desk */
      .together-in { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 64px; align-items: center; }
      .together-words .big { font: 900 var(--t-2)/0.98 var(--display); text-transform: uppercase; margin: 32px 0 24px; max-width: 13em; }
      .together-words p:not(.big) { max-width: 31em; }
      .band-ctl { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-top: 40px; }
      .or { color: var(--ink-2); }
      .join { display: inline-flex; gap: 0; align-items: stretch; }
      #band-code { width: 5.6em; font: 900 26px/1 var(--display); letter-spacing: 0.3em; text-transform: uppercase; text-align: center; color: var(--ink);
        background: var(--plum-2); border: 2px solid var(--ink); border-right: 0; border-radius: 0; padding: 0 0 0 0.3em; min-height: 64px; }
      #band-code::placeholder { color: var(--ink-2); opacity: 1; }
      #band-status { min-height: 1.6em; font-weight: 700; margin-top: 16px; }
      .seats { width: 100%; max-width: 420px; height: auto; justify-self: end; overflow: visible; }
      .seats .desk-top { fill: var(--plum-2); stroke: var(--line); stroke-width: 2; }
      .seats .seat > circle { fill: none; stroke: var(--ink-2); stroke-width: 2; stroke-dasharray: 150 26 70 43; }
      .seats .seat.on > circle { fill: var(--plum-2); stroke: var(--ink); stroke-dasharray: none; }
      .seats .seat:not(.seat-1).on > circle { fill: var(--ink); }
      .seats text { font-size: 14px; fill: var(--ink-2); }

      /* how to start: three steps, a staircase, each numeral in a hot arc */
      .steps { margin-top: 48px; display: grid; gap: 40px; }
      .steps li { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 32px; align-items: center; max-width: 760px; }
      .steps li:nth-child(2) { margin-left: 18%; }
      .steps li:nth-child(3) { margin-left: 36%; }
      .num { position: relative; display: grid; place-items: center; width: 168px; height: 168px; }
      .num svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .num circle { fill: none; stroke: var(--hot); stroke-width: 6; stroke-dasharray: 240 87; }
      .num span { font: 900 120px/1 var(--display); color: var(--ink); margin-top: -8px; }
      .steps h3 { font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; }
      .steps p { color: var(--ink-2); max-width: 28em; }
      .steps strong { color: var(--ink); white-space: nowrap; }

      /* specs and settings */
      .specs-in { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 64px; align-items: start; }
      .spec { margin-top: 32px; border-top: 2px solid var(--line); }
      .spec div { display: grid; grid-template-columns: 136px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--line); }
      .spec dt { font-size: 14px; line-height: 1.9; color: var(--ink-2); }
      .spec dd { font-size: var(--t-small); line-height: 1.6; }
      details.prep { margin-top: 56px; border-top: 2px solid var(--line); border-bottom: 2px solid var(--line); padding: 8px 0; }
      details.prep summary { font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; cursor: pointer; padding: 10px 0; }
      .opts { display: grid; gap: 12px; margin: 16px 0; font-size: var(--t-small); }
      .opts label { display: flex; gap: 10px; align-items: center; }
      .opts label.sel { flex-direction: column; align-items: flex-start; gap: 6px; }
      .range { display: flex; gap: 10px; align-items: center; }
      .opts input[type='checkbox'] { width: 20px; height: 20px; margin: 0; flex: none; accent-color: var(--hot); }
      .opts input[type='range'] { accent-color: var(--hot); width: 170px; }
      .opts select { font: inherit; color: var(--ink); background: var(--plum-2); border: 2px solid var(--line); border-radius: 0; padding: 8px; max-width: 100%; }
      .small-print { font-size: 15px; color: var(--ink-2); margin-top: 8px; }

      /* footer */
      .foot { margin-top: var(--sec); background: var(--plum-2); padding: 56px 0 64px; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); }
      .foot-in { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 48px; align-items: end; }
      .foot-brand .wordmark-svg { width: 200px; height: auto; display: block; color: var(--ink); margin-bottom: 20px; }
      .foot-text p + p { margin-top: 16px; display: flex; gap: 24px; }
      .foot a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--hot); text-decoration-thickness: 2px; text-underline-offset: 5px; }

      @media (max-width: 1060px) {
        .song { grid-template-columns: 48px minmax(0, 1fr) 160px 84px 200px; }
        .steps li:nth-child(2) { margin-left: 10%; }
        .steps li:nth-child(3) { margin-left: 20%; }
      }
      @media (max-width: 900px) {
        :root { --gut: 16px; --sec: 80px; --bar: 56px; }
        .nav { display: none; }
        .bar-in { justify-content: space-between; }
        .hero-top { padding: 40px 0 64px; }
        .hero-mark { width: 80vw; right: -30vw; top: -26vw; }
        .hero-word { width: min(560px, 84%); margin-top: calc(56vw - 40px); }
        .strip { margin: 0 -16px; padding: 0 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
        .strip::-webkit-scrollbar { display: none; }
        .cap { flex: 0 0 auto; width: calc(220px * var(--ar)); scroll-snap-align: start; scroll-margin-left: 16px; }
        .band-in, .hear-in, .score-in, .together-in, .specs-in, .foot-in { grid-template-columns: minmax(0, 1fr); gap: 40px; }
        .band-shot { position: static; padding-top: 0; }
        .how { min-height: 0; }
        .picker { flex-direction: row; flex-wrap: wrap; gap: 4px 20px; }
        .frame { padding: 8px; }
        .song { grid-template-columns: 40px minmax(0, 1fr) auto; grid-template-areas: 'no name name' '. by bpm' '. lv lv'; row-gap: 6px; }
        .song .no { grid-area: no; } .song .name { grid-area: name; } .song .by { grid-area: by; } .song .bpm { grid-area: bpm; } .song .lv { grid-area: lv; justify-content: flex-start; }
        .shots { padding-top: 0; }
        .seats { justify-self: start; max-width: 300px; }
        .steps li, .steps li:nth-child(2), .steps li:nth-child(3) { grid-template-columns: 104px minmax(0, 1fr); gap: 20px; margin-left: 0; }
        .num { width: 104px; height: 104px; }
        .num span { font-size: 72px; margin-top: -4px; }
        .spec div { grid-template-columns: 96px minmax(0, 1fr); gap: 12px; }
        details.prep { margin-top: 0; }
        .bg-arc { width: 760px; height: 760px; }
        .arc-band { left: -720px; }
        .arc-set { right: -720px; top: 80px; }
      }
      @media (min-width: 600px) and (max-width: 900px) {
        .hero-mark { width: 70vw; right: -32vw; top: -6vw; }
        .hero-word { width: 58%; margin-top: 24px; }
        .lede, .go-note { max-width: 25em; }
      }
      @media (max-width: 480px) {
        .btn { padding: 0 22px; font-size: 20px; }
        .cta .btn { flex: 1 1 100%; justify-content: flex-start; }
        .band-ctl { gap: 12px; }
        .join { flex: 1 1 100%; }
        #band-code { flex: 1 1 auto; width: auto; min-width: 0; }
        .hero-word { width: 88%; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage.unfold .inst-pos > .inst { animation: none; }
        .part.lit .glow > * { animation-duration: 1ms; }
        .hit-ring { animation: ring-still 400ms linear forwards; }
        .member .mark { transition: none; }
      }
      @keyframes ring-still { from { opacity: 1; } to { opacity: 0; } }

      /* the phone jam page (src/jam/phone.ts) */
      .jam { margin-top: 24px; border-top: 2px solid var(--line); padding-top: 16px; }
      .jam h2 { font: 800 24px/1.1 var(--display); text-transform: uppercase; margin: 0 0 6px; }
      .jam-lede { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 900 22px var(--display); letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px; background: var(--plum-2); color: var(--ink); border: 2px solid var(--ink); border-radius: 0; }
      .jam-status { color: var(--ink-2); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: var(--line); margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: var(--hot); } to { background: var(--line); } }
      .jam-song { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 2px solid var(--hot); border-radius: 50%; background: var(--plum-2); color: var(--ink); font: 700 16px var(--body); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { border-width: 4px; }
    </style>
