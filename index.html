<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Thump: a band on your desk</title>
    <meta name="description" content="Thump is a mixed-reality music game for Meta Quest 3, played sitting at a desk with your bare hands. Drums, keys, guitar, marimba, congas and a handpan; 19 songs on Easy, Normal and Hard; up to four players. Free, in the Quest browser." />

    <link rel="manifest" href="./manifest.webmanifest" />

    <meta property="og:title" content="Thump: a band on your desk" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@800;900&display=swap" />
    <style>
      /* Thump's site: the hit (docs/SITE-DESIGN.md). Deep plum, off-white type, one hot red-orange. Flat. */
      /* Atkinson Hyperlegible slashes its zero ("2Ø26"): the figures come from a plain sans instead (only 0–9) */
      @font-face { font-family: 'Figures'; font-weight: 400; unicode-range: U+0030-0039;
        src: local('Helvetica Neue'), local('HelveticaNeue'), local('Arial'), local('ArialMT'), local('Roboto'), local('Roboto-Regular'); }
      @font-face { font-family: 'Figures'; font-weight: 700; unicode-range: U+0030-0039;
        src: local('Helvetica Neue Bold'), local('HelveticaNeue-Bold'), local('Arial Bold'), local('Arial-BoldMT'), local('Roboto Bold'), local('Roboto-Bold'); }
      :root {
        --plum: #1d0b2c; --plum-2: #26103a; --line: #3d2357; --ink: #f6efe4; --ink-2: #b9aac9;
        --hot: #ff4b2b; --hot-ink: #1d0b2c;
        --display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
        --body: 'Figures', 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --t-mega: clamp(96px, 15vw, 220px); --t-1: clamp(52px, 7vw, 104px); --t-2: clamp(32px, 4vw, 56px);
        --t-3: 26px; --t-body: 19px; --t-small: 16px; --t-cap: 14px;
        --gut: 24px; --bar: 64px;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--plum); color: var(--ink); font-family: var(--body); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts; #landing-boot paints its top while the game loads: keep the two in step) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--plum); color: var(--ink);
        font: 400 var(--t-body)/1.55 var(--body); -webkit-font-smoothing: antialiased; }
      #landing[hidden] { display: none; }
      #landing [hidden] { display: none !important; }
      #landing *, #landing *::before, #landing *::after, #landing-boot * { box-sizing: border-box; }
      @media (prefers-reduced-motion: no-preference) { #landing { scroll-behavior: smooth; } }
      :where(#landing, #landing-boot) :where(p, h1, h2, h3, figure, ol, ul, dl, dd) { margin: 0; }
      :where(#landing) :where(ol, ul) { padding: 0; list-style: none; }
      :where(#landing, #landing-boot) img { display: block; max-width: 100%; height: auto; }
      .wrap { max-width: calc(1180px + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
      .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--ink); color: var(--plum); padding: 12px 16px; font-weight: 700; }
      .skip:focus { top: 12px; }
      #landing a { color: inherit; }
      #landing .skip { color: var(--plum); }
      #landing main:focus { outline: none; }
      #landing :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
      #landing section { scroll-margin-top: var(--bar); }
      .mark { display: block; }
      .nb { white-space: nowrap; }
      .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

      /* small metadata: the body face, bold, small capitals with air (never the display face) */
      .meta, .nav a, .label, .group, .bpm, .len, .spec dt, .desk-foot, .pick small, .eg-cap {
        font: 700 var(--t-cap)/1.3 var(--body); text-transform: uppercase; letter-spacing: 0.1em; }

      /* the bar: transparent over the hero; plum with a 2px rule once the page scrolls */
      .bar { position: sticky; top: 0; z-index: 20; background: transparent; border-bottom: 2px solid transparent; transition: background-color 160ms, border-color 160ms; }
      .bar.scrolled { background: var(--plum); border-bottom-color: var(--line); }
      .bar-in { display: flex; align-items: center; gap: 40px; height: var(--bar); }
      .brand { display: inline-flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; }
      .brand .mark { width: 24px; height: 24px; }
      .brand .wordmark-svg { width: 84px; height: auto; display: block; }
      .nav { display: flex; gap: 32px; margin-left: auto; }
      .nav a { text-decoration: none; color: var(--ink); padding: 8px 0; border-bottom: 2px solid transparent; }
      .nav a:hover { border-bottom-color: var(--hot); }

      /* buttons: square, upright; one hot primary */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 0 28px; border: 0; border-radius: 0;
        cursor: pointer; text-decoration: none; font: 900 22px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; }
      #landing .btn-1 { background: var(--hot); color: var(--hot-ink); }
      #landing .btn-1:hover { background: var(--ink); }
      #landing .btn-1:disabled { background: var(--line); color: var(--ink-2); cursor: default; }
      #landing .btn-2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
      #landing .btn-2:hover { background: var(--ink); color: var(--plum); }
      .btn-s { min-height: 40px; padding: 0 18px; font-size: 16px; }
      .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
        text-decoration: underline; text-decoration-color: var(--hot); text-decoration-thickness: 2px; text-underline-offset: 5px; }
      .link:hover, .foot a:hover { text-decoration-thickness: 4px; }

      .title { font: 900 var(--t-1)/0.9 var(--display); text-transform: uppercase; letter-spacing: -0.005em; }
      .label { display: block; color: var(--ink-2); margin-bottom: 20px; }
      .sec { position: relative; }
      /* captures: rendered over the page's own plum, so they sit in the page with no frame; edges feathered into it */
      .feather { -webkit-mask-image: radial-gradient(closest-side, #000 72%, transparent 100%); mask-image: radial-gradient(closest-side, #000 72%, transparent 100%);
        -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }

      /* the hero: the wordmark at a modest size, the line, the button; the kit at the moment of a Perfect off the right edge,
         the hit's rings spreading from the struck drum. Only the right edge cuts anything. */
      .hero { position: relative; overflow-x: clip; padding: 56px 0 96px; }
      .hero-in { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 520px); min-height: 560px; align-content: center; }
      #landing h1, #landing-boot h1 { margin: 0; width: min(360px, 76%); color: var(--ink); line-height: 0; }
      .hero h1 .wordmark-svg { display: block; width: 100%; height: auto; }
      .tag { font: 700 30px/1.2 var(--body); margin-top: 28px; letter-spacing: -0.005em; }
      .lede { max-width: 27em; color: var(--ink-2); margin-top: 16px; }
      .cta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 40px; }
      .go-note { font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); margin-top: 16px; max-width: 30em; min-height: 2.9em; }
      .xr-fail { color: var(--hot); font-weight: 700; margin-top: 12px; }
      /* the capture is shown no wider than its pixels (716): it bleeds 64px off the right */
      .hero-art { --w: min(716px, 52vw); position: absolute; top: 50%; right: -64px; width: var(--w); transform: translateY(-46%); margin: 0; }
      .hero-art img { width: 100%; }
      .hero-art .rings { position: absolute; left: var(--fx); top: var(--fy); width: 84%; aspect-ratio: 1; margin: -42% 0 0 -42%; overflow: visible; pointer-events: none; }
      .rings circle { fill: none; stroke: var(--hot); }
      .rings .ring { transform-box: fill-box; transform-origin: center; }
      .rings .pulse { stroke-width: 1.2; opacity: 0; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .rings .ring { animation: spread 1300ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
        .rings .ring-2 { animation-delay: 90ms; }
        .rings .ring-3 { animation-delay: 180ms; }
        .rings .ring > circle { transform-box: fill-box; transform-origin: center; }
        .rings .ring-1 > circle { animation: turn 60s linear infinite; }
        .rings .ring-2 > circle { animation: turn 84s linear infinite reverse; }
        .rings .ring-3 > circle { animation: turn 110s linear infinite; }
        .rings .pulse { animation: pulse 4.2s cubic-bezier(0.1, 0.6, 0.3, 1) 1.6s infinite; }
      }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes spread { from { transform: scale(0.55); opacity: 0; } 40% { opacity: 1; } to { transform: none; opacity: 1; } }
      @keyframes pulse { 0% { transform: scale(0.45); opacity: 0.9; } 70% { opacity: 0.25; } 100% { transform: scale(1.12); opacity: 0; } }

      /* the band: one list of the six drives the drawing and the capture */
      .band { padding-top: 96px; }
      .band-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 64px; align-items: end; }
      .band-head p { color: var(--ink-2); max-width: 30em; }
      .band-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 56px; align-items: start; margin-top: 48px; }
      .picker { border-top: 2px solid var(--line); }
      .picker li { border-bottom: 2px solid var(--line); }
      .pick { display: flex; align-items: baseline; gap: 14px; width: 100%; background: none; border: 0; padding: 12px 0 8px; cursor: pointer; text-align: left;
        font: 900 var(--t-2)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.01em; color: var(--ink); }
      .pick::before { content: ''; flex: none; width: 0.36em; height: 0.36em; align-self: center; background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
      .pick small { margin-left: auto; color: var(--ink-2); }
      .pick span { text-decoration: underline 3px transparent; text-underline-offset: 6px; transition: text-decoration-color 120ms; }
      .pick:hover span { text-decoration-color: var(--ink-2); }
      .pick[aria-pressed='true']::before { background: var(--hot); box-shadow: none; }
      .pick[aria-pressed='true'] span { text-decoration-color: var(--hot); }
      .picker { position: sticky; top: calc(var(--bar) + 24px); }
      /* the capture of the chosen one, under the drawing: the game's view beside how it's played there */
      .band-shot { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px; align-items: center; margin-top: 48px; }
      .band-shot img { width: 100%; max-width: 620px; aspect-ratio: 2 / 1; object-fit: contain; }
      .band-shot .label { margin-bottom: 10px; }
      .how { display: block; font-size: var(--t-body); line-height: 1.5; color: var(--ink); }

      .desk { margin: 0; }
      .frame { border: 2px solid var(--line); }
      .stage { position: relative; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .desk-svg { display: block; width: 100%; height: auto; }
      .desk-svg .o { fill: var(--plum-2); stroke: var(--ink); stroke-width: 2px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
      .desk-svg .l { fill: none; stroke: var(--line); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .desk-svg .l.dash { stroke: var(--ink-2); stroke-width: 1.5px; stroke-dasharray: 0.9 0.9; }
      .desk-svg .i { fill: var(--ink); }
      .desk-svg .key { fill: var(--ink); stroke: var(--plum); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .desk-svg .bkey { fill: var(--plum); stroke: var(--ink); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .desk-svg .rail { stroke: var(--line); stroke-width: 7px; vector-effect: non-scaling-stroke; }
      .desk-svg .hole { fill: var(--plum); stroke: var(--ink); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .desk-svg .str { stroke: var(--ink); stroke-width: 1px; vector-effect: non-scaling-stroke; }
      .desk-svg .str.wound { stroke-width: 2px; }
      .desk-svg .held { fill: var(--ink); stroke: var(--plum); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .stage.unfold .inst-pos > .inst { animation: unfold 260ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      .part { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--ink); fill-opacity: 0; stroke: none; pointer-events: none; }
      .part.pale .glow > * { fill: var(--plum); }
      .part .glow > .band { fill: none; stroke: var(--ink); stroke-opacity: 0; }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill-opacity: 0.6; stroke-opacity: 0.6; } to { fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { stroke: var(--hot); stroke-opacity: 1; stroke-width: 3px; vector-effect: non-scaling-stroke; }
      .part:focus-visible .glow > .band { stroke-width: 3px; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      /* the hit: a broken hot ring goes out from the point you hit, once */
      .hit-ring { position: absolute; width: 150px; height: 150px; margin: -75px 0 0 -75px; pointer-events: none; animation: ring 420ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
      .hit-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .hit-ring circle { fill: none; stroke: var(--hot); }
      @keyframes ring { from { transform: scale(0.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .desk-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; color: var(--ink-2); font-size: 12px; }
      .scale { display: flex; align-items: center; gap: 8px; flex: 0 0 40%; justify-content: flex-end; }
      .scale-bar { display: block; height: 7px; border: 2px solid var(--ink-2); border-top: 0; flex: none; }
      .about { margin-top: 20px; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); max-width: 42em; }

      /* the setlist: a full-bleed plum-2 field, big type rows like a tour poster */
      .setlist { margin-top: 160px; background: var(--plum-2); padding: 112px 0 120px; }
      .set-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 48px; align-items: end; }
      .set-head .title { font-size: var(--t-mega); line-height: 0.8; white-space: nowrap; margin-left: -0.03em; }
      .set-note { color: var(--ink); max-width: 17em; padding-bottom: 10px; justify-self: end; }
      .group { display: flex; align-items: baseline; gap: 12px; color: var(--ink); margin: 72px 0 0; padding-bottom: 12px; border-bottom: 2px solid var(--ink); }
      .group span { color: var(--ink-2); }
      .song { display: grid; grid-template-columns: 56px minmax(0, 1fr) 220px 88px 64px; align-items: baseline; column-gap: 16px; padding: 14px 0 12px; border-bottom: 2px solid var(--line); }
      .song:hover { background: var(--plum); }
      .song:hover .no { color: var(--hot); }
      .no { font: 800 22px/1 var(--display); color: var(--ink-2); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
      .name { font: 800 var(--t-2)/0.95 var(--display); text-transform: uppercase; letter-spacing: 0.005em; }
      .by { font-size: var(--t-small); color: var(--ink-2); }
      .bpm, .len { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
      .len { color: var(--ink); }
      .lessons { margin-top: 48px; max-width: 46em; color: var(--ink-2); }
      .lessons strong { color: var(--ink); }

      /* go for the S: the results capture leads, the title beside it, the four rules in one row under them */
      .score { padding-top: 200px; }
      .score-in { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 64px; align-items: center; }
      .score-shot img { width: 100%; max-width: 420px; }
      .score-words .title { font-size: clamp(64px, 9vw, 150px); line-height: 0.84; }
      .score-words .hot { color: var(--hot); }
      .score-words p { color: var(--ink-2); margin-top: 24px; max-width: 20em; }
      .rules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 32px; margin-top: 56px; border-top: 2px solid var(--line); padding-top: 20px; }
      .rules li { font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); }
      .rules strong { display: block; font: 800 var(--t-3)/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; color: var(--ink); margin-bottom: 6px; }

      /* play together: the one hot field on the page, in plum type; a code as display type */
      .together { margin-top: 128px; background: var(--hot); color: var(--hot-ink); padding: 96px 0 104px; }
      #landing .together :focus-visible { outline-color: var(--plum); }
      .together-in { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 6fr); gap: 48px; align-items: start; }
      .together .title { color: var(--plum); }
      .together-words .big { font: 700 26px/1.3 var(--body); margin: 28px 0 16px; max-width: 20em; }
      .together-words p:not(.big) { max-width: 30em; }
      .eg { justify-self: end; text-align: left; }
      .eg-code { display: block; font: 900 clamp(110px, 16vw, 236px)/0.8 var(--display); letter-spacing: 0.04em; color: var(--plum); }
      .eg-cap { display: block; margin-top: 18px; }
      .band-ctl { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); margin-top: 64px; border-top: 3px solid var(--plum); }
      .band-ctl > div { padding: 28px 0 0; }
      .band-ctl > div + div { border-left: 3px solid var(--plum); padding-left: 40px; }
      .band-ctl h3 { font: 800 var(--t-3)/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 6px; }
      .band-ctl .hint { font-size: var(--t-small); margin-bottom: 20px; max-width: 22em; }
      #landing .together .btn-1 { background: var(--plum); color: var(--ink); }
      #landing .together .btn-1:hover { background: var(--plum-2); }
      #landing .together .btn-2 { color: var(--plum); box-shadow: inset 0 0 0 3px var(--plum); }
      #landing .together .btn-2:hover { background: var(--plum); color: var(--ink); }
      .join { display: flex; gap: 20px; align-items: flex-end; }
      .field { display: grid; gap: 4px; flex: 0 1 260px; min-width: 0; }
      .field label { font: 800 var(--t-3)/1.1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
      #band-code { width: 100%; font: 900 48px/1 var(--display); letter-spacing: 0.24em; text-transform: uppercase; color: var(--plum); caret-color: var(--plum);
        background: transparent; border: 0; border-bottom: 3px solid var(--plum); border-radius: 0; padding: 6px 0 4px; min-height: 64px; }
      #band-code::placeholder { color: var(--plum); opacity: 0.45; }
      #landing #band-code:focus-visible { outline: none; border-bottom-width: 6px; padding-bottom: 1px; background: rgba(29, 11, 44, 0.08); }
      #band-status { min-height: 1.6em; font-weight: 700; margin-top: 24px; }

      /* how to start: one row, the numerals as type */
      .start { padding-top: 160px; }
      .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; margin-top: 40px; }
      .steps li { border-top: 2px solid var(--line); padding-top: 8px; }
      .num { display: block; font: 900 clamp(150px, 17vw, 240px)/0.8 var(--display); color: var(--ink); margin: 0 0 20px -0.04em; }
      .steps h3 { font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 8px; }
      .steps p { color: var(--ink-2); max-width: 22em; }
      .steps strong { color: var(--ink); white-space: nowrap; }

      /* specs and settings */
      .specs { padding-top: 96px; }
      .specs .title { font-size: var(--t-2); }
      .spec { margin-top: 24px; border-top: 2px solid var(--line); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; }
      .spec div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-bottom: 2px solid var(--line); }
      .spec dt { color: var(--ink-2); padding-top: 3px; }
      .spec div:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .spec dd { font-size: var(--t-small); line-height: 1.6; }
      details.prep { margin-top: 48px; border-bottom: 2px solid var(--line); }
      details.prep summary { list-style: none; display: flex; align-items: center; gap: 16px; cursor: pointer; padding: 16px 0; border-top: 2px solid var(--ink);
        font: 800 var(--t-3)/1.15 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
