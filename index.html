    <style>
      /* Thump's site (docs/SITE-DESIGN.md): a risograph gig flyer. Cream paper, two riso inks (fluorescent pink and
         blue) printed over each other with multiply so where they cross they darken, ink black for reading, a yellow
         highlighter for the thing that's chosen. Every colour is a property on :root: change the palette there and
         nothing else. The desk drawing prints in these same inks. */
      :root {
        /* paper and inks */
        --paper: #efe6d2; --paper-2: #e6dabf; --paper-hi: #faf5ea;
        --pink: #ff48b0; --blue: #3255a4; --yellow: #ffe24a;
        --ink: #1d1d1b; --ink-2: #4f4a42; --ink-3: #857e70;
        /* (the texture: a fine screen of ink dots over the paper) */
        --grain: radial-gradient(rgba(29, 29, 27, 0.07) 1px, transparent 1.3px) 0 0 / 5px 5px;
        --dots-pink: radial-gradient(var(--pink) 36%, transparent 38%) 0 0 / 10px 10px;
        --dots-blue: radial-gradient(var(--blue) 36%, transparent 38%) 0 0 / 10px 10px;
        /* type */
        --face: 'Bricolage Grotesque', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --t-hero: clamp(56px, 7.2vw, 108px); --t-2: clamp(40px, 5vw, 72px); --t-3: 26px;
        --t-body: 18px; --t-small: 16px;
        /* shape and space */
        --gut: 32px; --bar: 64px; --sec: 136px;
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--face); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts; #landing-boot paints its top while the game loads: keep the two in step) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--grain), var(--paper); background-attachment: local; color: var(--ink);
        font: 400 var(--t-body)/1.55 var(--face); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
      #landing[hidden] { display: none; }
      #landing [hidden] { display: none !important; }
      #landing *, #landing *::before, #landing *::after, #landing-boot *, #landing-boot *::before { box-sizing: border-box; }
      @media (prefers-reduced-motion: no-preference) { #landing { scroll-behavior: smooth; } }
      :where(#landing, #landing-boot) :where(p, h1, h2, h3, figure, ol, ul, dl, dd) { margin: 0; }
      :where(#landing, #landing-boot) :where(ol, ul) { padding: 0; list-style: none; }
      :where(#landing, #landing-boot) img { display: block; max-width: 100%; height: auto; }
      .wrap { max-width: calc(1200px + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
      .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--ink); color: var(--paper); padding: 12px 16px; border-radius: 999px; font-weight: 600; }
      .skip:focus { top: 12px; }
      #landing a { color: inherit; }
      #landing .skip { color: var(--paper); }
      #landing main:focus { outline: none; }
      #landing :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; border-radius: 4px; }
      #landing section { scroll-margin-top: var(--bar); }
      .nb { white-space: nowrap; }
      .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      strong { font-weight: 600; }

      /* the mark: its two rings in the two inks, the core in black */
      .mark { display: block; overflow: visible; }
      .mark .mark-ring { fill: none; stroke: var(--blue); }
      .mark .ring-1 .mark-ring { stroke: var(--pink); }
      .mark .ring { mix-blend-mode: multiply; }
      .mark .core { fill: var(--ink); }

      /* misregistration: the word in blue, a pink copy of it printed a few pixels off, the two multiplied */
      .riso { position: relative; color: var(--blue); mix-blend-mode: multiply; }
      .riso::before { content: attr(data-t); position: absolute; inset: 0; color: var(--pink); mix-blend-mode: multiply; pointer-events: none;
        transform: translate(var(--mx, 0.045em), var(--my, 0.03em)); }

      /* ---- the bar ---- */
      .bar { position: sticky; top: 0; z-index: 20; background: var(--grain), var(--paper); border-bottom: 2px solid transparent; transition: border-color 160ms; }
      .bar.scrolled { border-bottom-color: var(--ink); }
      .bar-in { display: flex; align-items: center; gap: 36px; height: var(--bar); }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 800 26px/1 var(--face); letter-spacing: -0.03em; }
      .brand .mark { width: 26px; height: 26px; }
      .nav { display: flex; gap: 28px; margin-left: auto; }
      .nav a { text-decoration: none; color: var(--ink); font: 600 17px/1 var(--face); padding: 8px 0; }
      .nav a:hover { text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 3px; text-underline-offset: 6px; }

      /* ---- buttons: pills. The one primary is pink with its blue plate printed off to the side ---- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 28px; border: 0; border-radius: 999px;
        cursor: pointer; text-decoration: none; font: 800 20px/1 var(--face); letter-spacing: -0.01em; white-space: nowrap; color: var(--ink);
        transition: transform 90ms ease-out, box-shadow 90ms ease-out, background-color 120ms, color 120ms; }
      #landing .btn-1 { background: var(--pink); color: var(--ink); box-shadow: 6px 5px 0 var(--blue); }
      #landing .btn-1:hover { transform: translate(-1px, -1px); box-shadow: 8px 7px 0 var(--blue); }
      #landing .btn-1:active { transform: translate(4px, 3px); box-shadow: 2px 2px 0 var(--blue); }
      #landing .btn-1:disabled { background: transparent; color: var(--ink-3); box-shadow: inset 0 0 0 2px var(--ink-3); transform: none; cursor: default; }
      #landing .btn-2 { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
      #landing .btn-2:hover { background: var(--ink); color: var(--paper); }
      #landing .btn-2:active { transform: translateY(1px); }
      .btn-s { min-height: 40px; padding: 0 18px; font-size: 17px; }
      .link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer;
        text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 2px; text-underline-offset: 4px; }
      .link:hover { text-decoration-thickness: 4px; }

      .h2 { font: 800 var(--t-2)/0.92 var(--face); letter-spacing: -0.045em; }
      .h3 { font: 800 var(--t-3)/1.05 var(--face); letter-spacing: -0.02em; }
      .lede { color: var(--ink-2); max-width: 34em; }
      .lede strong { color: var(--ink); }

      /* ---- the hero: what it is (play real instruments with your hands) beside the drum kit printed over the inks; the
         action under the line, the address on a ticket under the kit; then the video ---- */
      .hero { position: relative; overflow: clip; padding: 40px 0 0; }
      .hero-in { position: relative; padding-bottom: 56px; }
      .hero-top { position: relative; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); grid-template-areas: 'copy art' 'foot ticket'; gap: 36px 40px; align-items: start; }
      .hero-copy { grid-area: copy; position: relative; }
      .hero-art { grid-area: art; position: relative; align-self: center; width: 128%; margin: 12px 0 0 -26%; aspect-ratio: 104 / 62; }
      .hero-art .kit { position: absolute; inset: 0; transform: rotate(-7deg); }
      .hero-art .desk-svg { max-height: none; overflow: visible; }
      .hero-foot { grid-area: foot; position: relative; display: grid; gap: 26px; align-content: start; }
      .hero-top > .ticket { grid-area: ticket; justify-self: end; align-self: start; margin-top: -24px; }
      /* (the inks, placed on the kit's frame: a pink spot under it, a pink screen over the corner, a blue screen half
         under it) */
      .inks { position: absolute; inset: 0; pointer-events: none; }
      .ink { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
      /* (once the page runs, the inks are printed as one picture on one dot grid, black where they cross; the spans stay
         only to place them) */
      .ink-print { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; mix-blend-mode: multiply; }
      .ink-print ~ .ink { visibility: hidden; }
      .ink-1 { width: 74%; aspect-ratio: 1; left: 20%; top: -20%; background: var(--pink); }
      .ink-2 { width: 40%; aspect-ratio: 1; left: -6%; top: 46%; background: var(--dots-blue); }
      .ink-3 { width: 96%; aspect-ratio: 1; right: -44%; top: -78%; background: var(--dots-pink); }
      /* (the second line: the flyer's top line, printed small over the big one) */
      .kicker { display: inline-block; font: 800 clamp(26px, 2.5vw, 36px)/1 var(--face); letter-spacing: -0.035em; --mx: 0.05em; --my: 0.04em; margin-bottom: 14px; }
      #landing h1, #landing-boot h1 { position: relative; font: 800 var(--t-hero)/0.86 var(--face); letter-spacing: -0.045em; padding-top: 0.06em; }
      h1 .l { display: inline-block; width: 100%; --mx: 0.04em; --my: 0.028em; }
      @media (prefers-reduced-motion: no-preference) {
        /* (the pink plate slides into its misprint as the page opens) */
        h1 .l::before, .kicker::before { animation: misprint 700ms cubic-bezier(0.2, 0.8, 0.2, 1) 150ms both; }
      }
      @keyframes misprint { from { transform: none; } }
      .tag { font: 600 clamp(21px, 1.9vw, 27px)/1.3 var(--face); letter-spacing: -0.01em; max-width: 22em; }
      .go { display: grid; gap: 18px; justify-items: start; }
      .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
      .go-note { font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); max-width: 30em; min-height: 1.45em; }
      .xr-fail { color: var(--ink); background: var(--yellow); padding: 2px 6px; font-weight: 600; font-size: var(--t-small); }
      /* the address on a ticket stub, in black, tucked in at an angle */
      .ticket { position: relative; display: flex; align-items: stretch; color: var(--paper); transform: rotate(-4deg); max-width: 100%; }
      /* (the two halves each carry the ink, with a half-circle bitten out where they meet: real notches, the page shows
         through them) */
      .ticket .t-main, .ticket .t-stub { background: var(--ink); --notch: radial-gradient(circle 9px at var(--nx) 0, transparent 8.5px, #000 9px), radial-gradient(circle 9px at var(--nx) 100%, transparent 8.5px, #000 9px);
        -webkit-mask: var(--notch); -webkit-mask-composite: source-in; mask: var(--notch); mask-composite: intersect; }
      .ticket .t-main { --nx: 100%; display: grid; gap: 6px; padding: 18px 22px 18px 24px; border-radius: 6px 0 0 6px; }
      .ticket .t-top { font-size: 15px; line-height: 1.2; color: #d8cfbb; }
      .addr-url { font: 800 clamp(22px, 2.1vw, 30px)/1 var(--face); letter-spacing: -0.03em; color: var(--paper); background: none; border: 0; padding: 0; cursor: copy; text-align: left;
        text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 3px; text-underline-offset: 6px; }
      .addr-url:hover { text-decoration-thickness: 5px; }
      #landing .ticket :focus-visible { outline-color: var(--yellow); }
      /* (the stub, past a perforation: notches cut top and bottom, a dashed tear line) */
      .ticket .t-stub { --nx: 0%; position: relative; display: grid; place-items: center; padding: 0 18px; border-left: 2px dashed rgba(239, 230, 210, 0.45); border-radius: 0 6px 6px 0;
        font: 800 15px/1.1 var(--face); text-align: center; color: var(--yellow); }

      /* ---- slots: the video and the screenshots. Filled when the file is there; until then a quiet empty slot ---- */
      /* (no screenshots yet: their row stays out of the way; once one is in, the first is big and the others stack beside it) */
      .media { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .media.has-shots { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
      .slot { position: relative; margin: 0; border-radius: 6px; overflow: hidden; }
      .slot.filled { box-shadow: 0 0 0 3px var(--ink); background: var(--ink); }
      .slot-video { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
      /* (empty, the video's slot is a letterbox, so the page doesn't open on a big box) */
      .slot-video:not(.filled) { aspect-ratio: auto; height: clamp(180px, 18vw, 250px); }
      .media:not(.has-shots) .shot { display: none; }
      .slot .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; background: var(--ink); }
      .slot.filled .fill { opacity: 1; }
      video.fill { object-fit: contain; }
      .slot.filled .empty { display: none; }
      .slot:not(.filled) .fill { pointer-events: none; }
      .shot { aspect-ratio: 16 / 9; }
      .has-shots .shot-1 { grid-row: span 2; aspect-ratio: auto; min-height: 100%; }
      /* the empty state: a paste-up box (a dashed line where the picture goes), its name and one line */
      .slot:not(.filled) { border: 2px dashed var(--ink-3); }
      .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; text-align: left; padding: 24px; color: var(--ink-2); }
      .empty .slot-name { display: block; font: 800 22px/1.1 var(--face); letter-spacing: -0.02em; color: var(--ink); }
      .empty p { font-size: var(--t-small); line-height: 1.4; max-width: 22em; margin-top: 4px; }
      .shot .empty p { font-size: 15px; }
      .play-mark { flex: none; width: 56px; height: 56px; }
      .play-mark circle { fill: var(--pink); mix-blend-mode: multiply; }
      .play-mark path { fill: var(--ink); }

      /* ---- how to play: a real sequence, so numbered ---- */
      .how { padding-top: var(--sec); }
      .how-in { display: grid; gap: 36px; }
      /* (three tear-off strips, like the bottom of a flyer: a perforated edge between them, each with a round sticker) */
      .steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
      .steps li { position: relative; display: grid; align-content: start; gap: 18px; padding: 30px 32px 34px; font: 600 clamp(21px, 1.9vw, 26px)/1.3 var(--face); letter-spacing: -0.01em; }
      .steps li + li { background-image: radial-gradient(circle, var(--ink) 2px, transparent 2.4px); background-size: 4px 12px; background-repeat: repeat-y; background-position: left top; }
      .steps li:nth-child(2) { transform: translateY(10px); }
      .steps .num { display: grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; border: 3px solid var(--ink);
        font: 800 clamp(40px, 3.6vw, 56px)/1 var(--face); letter-spacing: -0.04em; color: var(--ink); justify-self: start;
        box-shadow: 5px 5px 0 var(--blue); transform: rotate(-6deg); }
      .step-1 .num { background: var(--pink); }
      .step-2 .num { background: var(--yellow); transform: rotate(5deg); }
      .step-3 .num { background: var(--blue); color: var(--paper); box-shadow: 5px 5px 0 var(--pink); transform: rotate(-3deg); }
      .steps .say strong { background: linear-gradient(transparent 58%, var(--yellow) 58%); mix-blend-mode: multiply; font-weight: 800; }
      .how-note { margin-top: 24px; color: var(--ink-2); max-width: 36em; }

      /* ---- the instruments: the lineup picks one, the drawing plays it ---- */
      .play { padding-top: var(--sec); }
      .play-head { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px 56px; align-items: end; }
      .play-head .lede { max-width: 30em; }
      .lineup { margin-top: 36px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 0; }
      .lineup li { display: flex; align-items: baseline; }
      .lineup li + li::before { content: '/' / ''; padding: 0 0.2em; font: 800 clamp(36px, 5.6vw, 80px)/1 var(--face); color: var(--pink); mix-blend-mode: multiply; }
      .pick { position: relative; display: inline-block; background: none; border: 0; padding: 0.04em 0.08em 0.1em; margin: 0; cursor: pointer; color: var(--blue);
        font: 800 clamp(36px, 5.6vw, 80px)/1 var(--face); letter-spacing: -0.05em; mix-blend-mode: multiply; border-radius: 4px; }
      .pick-name { position: relative; }
      .pick:hover .pick-name { text-decoration: underline; text-decoration-color: var(--pink); text-decoration-thickness: 0.07em; text-underline-offset: 0.12em; }
      /* (the chosen one, marked with a highlighter swipe printed under it) */
      .pick[aria-pressed='true'] { color: var(--ink); }
      .pick[aria-pressed='true']::before { content: ''; position: absolute; left: -0.02em; right: -0.02em; top: 0.22em; bottom: 0.08em; background: var(--yellow); border-radius: 0.06em 0.12em 0.05em 0.1em; transform: rotate(-1.2deg); mix-blend-mode: multiply; }
      .pick[aria-pressed='true']:hover .pick-name { text-decoration: none; }
      .deck { margin-top: 28px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; background: var(--paper-hi); }
      .desk { margin: 0; display: contents; }
      .stage { position: relative; background: radial-gradient(rgba(50, 85, 164, 0.16) 1.2px, transparent 1.5px) 0 0 / 9px 9px, var(--paper-2); touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        display: grid; align-items: center; min-height: 100%; }
      .desk-foot { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); align-items: end; gap: 14px 48px; padding: 22px 26px 24px; border-top: 3px solid var(--ink); }
      .now-name { font: 800 34px/1 var(--face); letter-spacing: -0.04em; }
      .now-line { display: block; margin-top: 12px; font: 600 19px/1.4 var(--face); letter-spacing: -0.005em; }
      .about { min-height: 1.45em; font-size: var(--t-small); line-height: 1.45; color: var(--ink-2); }
      .desk-svg { display: block; width: 100%; height: auto; max-height: min(70vh, 560px); }
      /* the drawing's inks (src/ui/landing-drawing.ts): fills, lines and dot screens by class; x overprints (multiply) */
      .desk-svg .x { mix-blend-mode: multiply; }
      .desk-svg .fp { fill: var(--pink); } .desk-svg .fb { fill: var(--blue); } .desk-svg .fk { fill: var(--ink); } .desk-svg .fy { fill: var(--yellow); }
      .desk-svg .fw { fill: var(--paper-hi); } .desk-svg .fq { fill: var(--paper-2); } .desk-svg .fn { fill: none; } .desk-svg .clear { fill: transparent; }
      .desk-svg .kk { stroke: var(--ink); } .desk-svg .kp { stroke: var(--pink); } .desk-svg .kb { stroke: var(--blue); } .desk-svg .kw { stroke: var(--paper-hi); }
      .desk-svg :is(.w1, .w15, .w2, .w3) { vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
      .desk-svg .w1 { stroke-width: 1px; } .desk-svg .w15 { stroke-width: 1.5px; } .desk-svg .w2 { stroke-width: 2.25px; } .desk-svg .w3 { stroke-width: 3.5px; }
      .desk-svg .dp { fill: var(--pink); } .desk-svg .db { fill: var(--blue); } .desk-svg .dk { fill: var(--ink); } .desk-svg .dy { fill: var(--yellow); }
      .desk-svg .deco, .desk-svg text, .desk-svg .aim { pointer-events: none; }
      .desk-svg .aim { fill: none; stroke: none; }
      .desk-svg .lbl { font-family: var(--face); font-weight: 800; letter-spacing: -0.02em; fill: var(--ink); }
      .desk-svg .ttl { font-family: var(--face); font-weight: 800; letter-spacing: -0.04em; fill: var(--paper-hi); }
      .stage.unfold .inst-pos > .inst { animation: unfold 240ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      /* a part: the yellow highlighter under the pointer, a flash of the other ink when it's hit (pink parts flash
         blue), both overprinted so they print purple, orange or green where they land */
      .part { --flash: var(--pink); --hov: var(--yellow); --hov-o: 0.75; }
      .part.t-pink { --flash: var(--blue); }
      .part.t-blue { --hov: var(--pink); --hov-o: 0.55; }
      .part.t-dark { --hov-o: 0.6; }
      .part, #landing .part:focus-visible { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--flash); fill-opacity: 0; stroke: none; pointer-events: none; mix-blend-mode: multiply; }
      .part.t-dark .glow > * { mix-blend-mode: normal; }
      .part .glow > .band { fill: none; stroke: var(--flash); stroke-opacity: 0; }
      @media (hover: hover) {
        .part:hover .glow > * { fill: var(--hov); fill-opacity: var(--hov-o); }
        .part:hover .glow > .band { fill: none; stroke: var(--hov); stroke-opacity: var(--hov-o); }
      }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill: var(--flash); stroke: var(--flash); fill-opacity: 0.9; stroke-opacity: 0.9; } to { fill: var(--flash); stroke: var(--flash); fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { fill: var(--hov); fill-opacity: var(--hov-o); stroke: var(--ink); stroke-opacity: 1; stroke-width: 3px; vector-effect: non-scaling-stroke; }
      .part:focus-visible .glow > .band { fill: none; stroke: var(--hov); stroke-width: 3px; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      /* the ring closing onto what's next (round for a drum, square for a key), as in the game, in blue */
      .close-ring { position: absolute; pointer-events: none; border: 3px solid var(--blue); border-radius: 4px; mix-blend-mode: multiply; animation: close-in linear forwards; }
      .close-ring.round { border-radius: 50%; }
      @keyframes close-in { from { transform: scale(1.9); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
      /* the hit: a broken pink ring goes out from the point you hit, once */
      .hit-ring { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; pointer-events: none; mix-blend-mode: multiply; animation: ring 420ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
      .hit-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .hit-ring circle { fill: none; stroke: var(--pink); }
      @keyframes ring { from { transform: scale(0.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }

      /* ---- songs: the running order ---- */
      .songs-sec { padding-top: var(--sec); }
      .songs-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 32px 56px; align-items: start; }
      .songs-in .lede { margin-top: 20px; }
      .songs { columns: 2; column-gap: 48px; border-top: 3px solid var(--ink); }
      .song { break-inside: avoid; display: grid; grid-template-columns: 2.1em auto minmax(12px, 1fr) auto; gap: 0 10px; align-items: baseline; padding: 12px 0 10px; border-bottom: 1px solid var(--ink); }
      .song .n { grid-row: 1 / span 2; font: 800 19px/1.2 var(--face); color: var(--blue); align-self: start; }
      .song .name { font: 800 22px/1.15 var(--face); letter-spacing: -0.025em; }
      /* (dot leaders from the name to its length, as a running order prints them) */
      .song .lead { align-self: end; margin-bottom: 0.4em; border-bottom: 3px dotted var(--ink-3); }
      .song .len { font: 600 17px/1.2 var(--face); text-align: right; }
      .song .by { grid-column: 2 / span 2; font-size: 15px; line-height: 1.35; color: var(--ink-2); }
      .song .bpm { grid-column: 4; font-size: 15px; line-height: 1.35; color: var(--ink-2); text-align: right; }
      /* (an original: its number on a pink spot) */
      .song.orig .n { justify-self: start; display: grid; place-items: center; width: 1.75em; height: 1.75em; margin: -0.3em 0 0 -0.32em; border-radius: 50%; background: var(--pink); color: var(--ink); mix-blend-mode: multiply; font-size: 17px; }
      .key { margin-top: 14px; font-size: 15px; color: var(--ink-2); display: flex; align-items: center; gap: 10px; }
      .key::before { content: ''; width: 14px; height: 14px; border-radius: 50%; background: var(--pink); mix-blend-mode: multiply; }

      /* ---- make a track, play together: one bill in two parts, torn along a perforation. The stub (pink, a loop on a
         step grid) is making a track; the ticket (paper) is playing together, its code a ticket number in a stamped box ---- */
      .more { padding-top: var(--sec); }
      .bill { position: relative; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); border: 3px solid var(--ink); border-radius: 14px; background: var(--paper-hi); }
      /* (the perforation: a dashed tear line, and a notch bitten out of the edge top and bottom) */
      .track::before, .track::after { content: ''; position: absolute; right: -16.5px; width: 30px; height: 30px; border-radius: 50%; background: var(--paper); border: 3px solid var(--ink); z-index: 1; }
      .track::before { top: -16.5px; clip-path: inset(50% 0 0 0); }
      .track::after { bottom: -16.5px; clip-path: inset(0 0 50% 0); }
      .track { position: relative; padding: 40px 36px 36px; background: var(--pink); border-radius: 11px 0 0 11px; border-right: 3px dashed var(--ink); display: grid; grid-template-rows: auto auto 1fr; gap: 16px; }
      .track .loop { align-self: end; }
      .track .h2 { color: var(--ink); font-size: clamp(36px, 3.6vw, 52px); }
      .track p { font-weight: 600; max-width: 22em; }
      .loop { margin-top: 14px; display: grid; grid-template-columns: auto repeat(16, minmax(0, 1fr)); gap: 5px; align-items: center; }
      .loop-name { font: 600 14px/1 var(--face); padding-right: 6px; }
      .loop i { aspect-ratio: 1; border-radius: 3px; background: var(--paper-hi); box-shadow: inset 0 0 0 1.5px var(--ink); }
      .loop i:nth-of-type(4n + 1) { box-shadow: inset 0 0 0 2.5px var(--ink); }
      .loop i.on { background: var(--blue); box-shadow: inset 0 0 0 1.5px var(--ink), 2px 2px 0 var(--ink); }
      .loop i.now { background: var(--yellow); }
      .loop i.now.on { background: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink), 0 0 0 3px var(--yellow); }
      .together { padding: 40px 40px 36px 44px; }
      .together .h2 { font-size: clamp(38px, 3.8vw, 56px); }
      .together .lede { margin-top: 16px; color: var(--ink); max-width: 32em; }
      .band-ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); margin-top: 28px; border-top: 3px solid var(--ink); }
      .band-ctl > div { padding: 22px 28px 4px 0; display: grid; gap: 14px; align-content: start; }
      .band-ctl > div + div { padding-left: 28px; padding-right: 0; border-left: 2px solid var(--ink); }
      .band-ctl .hint { font-size: 15px; line-height: 1.4; color: var(--ink-2); margin: -6px 0 0; }
      .band-ctl .btn { justify-self: start; }
      .join { display: flex; gap: 12px; align-items: center; }
      /* (the code: a ticket number in a stamped box, inked in blue, a little crooked) */
      .stamp { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border: 3px solid var(--blue); border-radius: 6px; box-shadow: inset 0 0 0 2px var(--paper-hi), inset 0 0 0 3.5px var(--blue); transform: rotate(-1.5deg); color: var(--blue); background: var(--paper-hi); }
      .stamp .no { font: 800 18px/1 var(--face); letter-spacing: -0.02em; }
      .stamp:focus-within { box-shadow: inset 0 0 0 2px var(--paper-hi), inset 0 0 0 3.5px var(--blue), 0 0 0 3px var(--yellow); }
      #band-code { flex: 1 1 auto; min-width: 0; width: 100%; font: 800 30px/1 var(--face); letter-spacing: 0.24em; text-transform: uppercase; color: var(--blue); caret-color: var(--pink);
        background: transparent; border: 0; padding: 0 4px; min-height: 48px; }
      #band-code::placeholder { color: var(--blue); opacity: 0.35; }
      #landing #band-code:focus-visible { outline: none; }
      #band-status { min-height: 1.5em; font-weight: 600; margin-top: 16px; margin-bottom: -8px; }
      #band-status:not(:empty) { display: inline-block; background: var(--yellow); padding: 2px 6px; }
      .band-phone { display: none; margin-top: 24px; font-weight: 600; }
      #landing[data-where='phone'] .band-ctl, #landing[data-where='phone'] #band-status { display: none; }
      #landing[data-where='phone'] .band-phone { display: block; }

      /* ---- settings ---- */
      .prep-sec { padding-top: 88px; }
      details.prep { border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
      details.prep summary { list-style: none; display: flex; align-items: baseline; gap: 16px; cursor: pointer; padding: 18px 0; font: 800 28px/1.15 var(--face); letter-spacing: -0.03em; }
      details.prep summary::-webkit-details-marker { display: none; }
      details.prep summary small { font: 400 15px/1.4 var(--face); letter-spacing: 0; color: var(--ink-2); }
      .pm { position: relative; flex: none; align-self: center; width: 34px; height: 34px; margin-left: auto; border-radius: 50%; box-shadow: inset 0 0 0 3px var(--ink); }
      .pm::before, .pm::after { content: ''; position: absolute; left: 10px; right: 10px; top: 15.5px; height: 3px; border-radius: 1px; background: var(--ink); }
      .pm::after { transform: rotate(90deg); }
      details.prep[open] .pm::after { display: none; }
      details.prep summary:hover .pm { background: var(--yellow); }
      .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 40px; margin: 8px 0 24px; font-size: var(--t-small); align-items: start; }
      .opts label { display: flex; gap: 12px; align-items: center; cursor: pointer; }
      .opts label.sel { flex-direction: column; align-items: flex-start; gap: 8px; cursor: default; font-weight: 600; }
      .range { display: flex; gap: 10px; align-items: center; font-weight: 400; }
      /* toggles: an inked track; on = yellow, the knob at that side */
      .opts input[type='checkbox'] { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 44px; height: 26px; margin: 0; border-radius: 13px; background: var(--paper-hi); box-shadow: inset 0 0 0 2px var(--ink); cursor: pointer; transition: background-color 120ms; }
      .opts input[type='checkbox']::after { content: ''; position: absolute; top: 5px; left: 5px; width: 16px; height: 16px; border-radius: 50%; background: var(--ink-3); transition: transform 120ms, background-color 120ms; }
      .opts input[type='checkbox']:checked { background: var(--yellow); }
      .opts input[type='checkbox']:checked::after { transform: translateX(18px); background: var(--ink); }
      .opts input[type='range'] { accent-color: var(--blue); width: 170px; }
      .opts select { font: inherit; font-weight: 400; color: var(--ink); background: var(--paper-hi); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 10px; max-width: 100%; }
      .small-print { font-size: 15px; color: var(--ink-2); margin: 4px 0 24px; }

      /* ---- who made it ---- */
      .foot { margin-top: var(--sec); padding: 0 0 72px; font-size: var(--t-small); line-height: 1.5; }
      .foot-in { position: relative; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 32px 56px; align-items: start; padding-top: 48px; }
      .foot-in::before { content: ''; position: absolute; top: 0; left: var(--gut); right: var(--gut); border-top: 3px solid var(--ink); }
      .maker { font: 600 22px/1.4 var(--face); letter-spacing: -0.01em; margin-top: 20px; max-width: 18em; }
      .plate { display: grid; grid-template-columns: 140px minmax(0, 1fr); border-top: 1px solid var(--ink); }
      .plate dt, .plate dd { padding: 14px 0; border-bottom: 1px solid var(--ink); }
      .plate dt { font-weight: 800; color: var(--blue); }
      .plate dd.credit { color: var(--ink-2); font-size: 15px; }
      .sign { margin-top: 48px; display: flex; align-items: center; gap: 14px; font: 800 clamp(48px, 6vw, 88px)/0.9 var(--face); letter-spacing: -0.055em; }
      .sign .mark { width: 0.8em; height: 0.8em; flex: none; }

      @media (max-width: 1060px) {
        .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .nav { gap: 22px; }
      }
      /* tablet and phone */
      @media (max-width: 900px) {
        :root { --gut: 20px; --bar: 56px; --sec: 96px; }
        .nav { display: none; }
        .bar-in { justify-content: space-between; }
        .hero { padding-top: 24px; }
        .hero-in { padding-bottom: 40px; }
        /* (one column: the line, the kit, what it is and the action, the address) */
        .hero-top { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'copy' 'art' 'foot' 'ticket'; gap: 20px; }
        .hero-art { width: 100%; margin: 28px 0 32px; }
        .hero-art .kit { transform: rotate(-5deg); }
        .hero-top > .ticket { justify-self: start; margin: 4px 0 8px 6px; }
        :root { --t-hero: 12.4vw; }
        .how-in, .play-head, .songs-in, .foot-in { grid-template-columns: minmax(0, 1fr); }
        .ticket { transform: rotate(-3deg); }
        .steps { grid-template-columns: minmax(0, 1fr); }
        .steps li, .steps li + li { grid-template-columns: 76px minmax(0, 1fr); gap: 0; align-items: center; padding: 18px 0; transform: none; background: none; border-bottom: 2px dashed var(--ink); }
        .steps li:last-child { border-bottom: 0; }
        .steps .num { font-size: 32px; }
        .media { gap: 12px; }
        .media.has-shots { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .has-shots .shot-1 { grid-column: 1 / -1; grid-row: auto; aspect-ratio: 16 / 9; min-height: 0; }
        .desk-foot { grid-template-columns: minmax(0, 1fr); padding: 18px 18px 20px; }
        .now-name { font-size: 28px; }
        /* (the bill stands up: the stub on top, torn along a line across) */
        .bill { grid-template-columns: minmax(0, 1fr); }
        .track::before, .track::after { top: auto; right: auto; bottom: -16.5px; }
        .track::before { left: -18px; clip-path: inset(0 0 0 50%); }
        .track::after { right: -18px; clip-path: inset(0 50% 0 0); }
        .track { border-radius: 11px 11px 0 0; border-right: 0; border-bottom: 3px dashed var(--ink); padding: 32px 28px 30px; }
        .together { padding: 32px 28px 30px; }
      }
      @media (max-width: 640px) {
        /* (on a phone the hero's button is a screen away: no second copy in the bar) */
        #bar-enter { display: none; }
        :root { --gut: 16px; --sec: 80px; }
        :root { --t-hero: 15.4vw; }
        .btn { padding: 0 22px; }
        .cta { width: 100%; }
        .cta .btn { flex: 1 1 100%; }
        .ticket .t-main { padding: 14px 16px 14px 18px; }
        .ticket .t-stub { padding: 0 12px; }
        .media, .media.has-shots { grid-template-columns: minmax(0, 1fr); }
        .media:not(.has-shots) .shot { aspect-ratio: 5 / 2; }
        .media:not(.has-shots) .shot:not(.shot-1) { display: none; }
        .slot-video:not(.filled) { height: 230px; }
        .empty { flex-direction: column; text-align: center; gap: 12px; }
        .lineup li + li::before { padding: 0 0.14em; }
        .songs { columns: 1; }
        .track, .together { padding: 26px 20px 26px; }
        .loop { gap: 3px; }
        .loop-name { font-size: 12px; padding-right: 4px; }
        .band-ctl { grid-template-columns: minmax(0, 1fr); }
        .band-ctl > div, .band-ctl > div + div { padding: 20px 0 8px; border-left: 0; }
        .band-ctl > div + div { border-top: 2px dashed var(--ink); margin-top: 12px; }
        .opts { grid-template-columns: minmax(0, 1fr); }
        details.prep summary { flex-wrap: wrap; row-gap: 4px; }
        details.prep summary small { order: 3; flex-basis: 100%; }
        .plate { grid-template-columns: minmax(0, 1fr); }
        .plate dt { border-bottom: 0; padding-bottom: 0; }
        .plate dd { padding-top: 4px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage.unfold .inst-pos > .inst { animation: none; }
        .part.lit .glow > * { animation: lit 260ms steps(1, end); }
        .hit-ring { animation: ring-still 400ms linear forwards; }
        .bar, .btn, .opts input[type='checkbox'], .opts input[type='checkbox']::after { transition: none; }
        #landing .btn-1:hover, #landing .btn-1:active { transform: none; }
      }
      @keyframes ring-still { from { opacity: 1; } to { opacity: 0; } }

      /* the phone jam page (src/jam/phone.ts) */
      .jam { margin-top: 24px; border-top: 2px solid var(--ink); padding-top: 16px; }
      .jam h2 { font: 800 26px/1.1 var(--face); letter-spacing: -0.03em; margin: 0 0 6px; }
      .jam-lede { color: var(--ink-2); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 800 22px var(--face); letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px; background: var(--paper-hi); color: var(--ink); border: 3px solid var(--ink); border-radius: 10px; }
      .jam-status { color: var(--ink-2); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: var(--paper-2); box-shadow: inset 0 0 0 2px var(--ink); margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: var(--pink); } to { background: var(--paper-2); } }
      .jam-song { color: var(--ink-2); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 3px solid var(--ink); border-radius: 50%; background: var(--pink); color: var(--ink); font: 800 16px var(--face); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; background: var(--paper-hi); }
      .jam-pad.hit { border-width: 6px; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <!-- the top of the page while the game loads (src/ui/landing.ts replaces it: keep the two in step) -->
    <div id="landing-boot">
      <header class="bar"><div class="wrap bar-in"><span class="brand"><svg class="mark" viewBox="-372 -372 744 744" aria-hidden="true"><g class="ring ring-1"><circle class="mark-ring" r="170" stroke-width="92" stroke-dasharray="800 270" transform="rotate(-20)"/></g><g class="ring ring-2"><circle class="mark-ring" r="330" stroke-width="64" stroke-dasharray="700 240 600 540" transform="rotate(30)"/></g><circle class="core" r="84"/></svg>Thump</span></div></header>
      <section class="hero">
        <div class="wrap hero-in">
          <div class="hero-top">
          <div class="hero-copy"><p class="kicker riso" data-t="A band on your desk.">A band on your desk.</p>
          <h1><span class="l riso" data-t="Play real">Play real</span> <span class="l riso" data-t="instruments">instruments</span> <span class="l riso" data-t="with just">with just</span> <span class="l riso" data-t="your hands.">your hands.</span></h1></div>
          <div class="hero-art"><div class="inks" aria-hidden="true"><span class="ink ink-1"></span><span class="ink ink-2"></span><span class="ink ink-3"></span></div></div>
          <div class="hero-foot"><p class="tag">A VR music game for Quest 3. No controllers, you just play the drums, keys and guitar right on your actual desk.</p></div></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
