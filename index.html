    <meta name="description" content="A VR music game for Meta Quest 3 you play with just your hands, no controllers, on your actual desk. Keyboard, drums, marimba, congas, handpan and a guitar. Free in the Quest browser." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" />
    <link rel="preload" as="font" type="font/ttf" href="./fonts/BarlowCondensed-Bold.ttf" crossorigin />
    <style>
      /* Thump's site (docs/SITE-DESIGN.md, after docs/UI-DIRECTION.md). Music hardware: warm graphite, flat, one signal
         orange for the one action and small "this one" markers. Every colour is a property on :root: change the palette
         there and nothing else. The --i-* are the instruments' own colours in the desk drawing. */
      /* the headset panel's face (public/fonts), for titles, names and labels */
      @font-face { font-family: 'Barlow Condensed'; font-weight: 500; font-display: swap; src: url('./fonts/BarlowCondensed-Medium.ttf') format('truetype'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url('./fonts/BarlowCondensed-SemiBold.ttf') format('truetype'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url('./fonts/BarlowCondensed-Bold.ttf') format('truetype'); }
      :root {
        /* surfaces */
        --bg: #161419; --raised: #211e24; --pressed: #2b2730; --line: #36323b;
        /* text */
        --text: #f2eee8; --text-2: #a29da8; --text-3: #6d6873;
        /* the one accent, and type on it */
        --accent: #ff5a1f; --on-accent: #1a0d07;
        /* the instruments in the desk drawing, in the colours the game paints them */
        --i-edge: #161419;
        --i-head: #f3eee4; --i-shell: #d23d2b; --i-chrome: #d9d6df; --i-brass: #d2a54a; --i-groove: #9a7428;
        --i-key: #f2eee8; --i-bkey: #141216; --i-case: #3a353f; --i-felt: #7a1f1a;
        --i-rosewood: #8e3a22; --i-rail: #6a5444;
        --i-skin: #ead6b0; --i-skin-line: #8b6a3e;
        --i-bronze: #a88a4e; --i-note: #8a6f39; --i-dimple: #5f4a22;
        --i-spruce: #e6c88f; --i-board: #3a2318; --i-rosette: #6b4a2a; --i-hole: #141216; --i-string: #e9e3d6;
        /* type */
        --cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
        --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', sans-serif;
        --t-hero: clamp(64px, 9.6vw, 148px); --t-2: clamp(40px, 4.6vw, 64px); --t-3: 28px;
        --t-body: 18px; --t-small: 16px; --t-label: 13px;
        /* shape and space */
        --r: 8px; --r-s: 6px;
        --gut: 32px; --bar: 64px; --sec: 136px;
        color-scheme: dark;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--body); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts; #landing-boot paints its top while the game loads: keep the two in step) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--bg); color: var(--text);
        font: 400 var(--t-body)/1.55 var(--body); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
      #landing[hidden] { display: none; }
      #landing [hidden] { display: none !important; }
      #landing *, #landing *::before, #landing *::after, #landing-boot * { box-sizing: border-box; }
      @media (prefers-reduced-motion: no-preference) { #landing { scroll-behavior: smooth; } }
      :where(#landing, #landing-boot) :where(p, h1, h2, h3, figure, ol, ul, dl, dd) { margin: 0; }
      :where(#landing, #landing-boot) :where(ol, ul) { padding: 0; list-style: none; }
      :where(#landing, #landing-boot) img { display: block; max-width: 100%; height: auto; }
      .wrap { max-width: calc(1200px + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut); }
      .skip { position: absolute; left: 12px; top: -80px; z-index: 30; background: var(--text); color: var(--bg); padding: 12px 16px; border-radius: var(--r-s); font-weight: 600; }
      .skip:focus { top: 12px; }
      #landing a { color: inherit; }
      #landing .skip { color: var(--bg); }
      #landing main:focus { outline: none; }
      #landing :focus-visible { outline: 2px solid var(--text); outline-offset: 3px; border-radius: 2px; }
      #landing section { scroll-margin-top: var(--bar); }
      .mark { display: block; }
      .mark .mark-ring { fill: none; stroke: var(--accent); }
      .mark .core { fill: var(--text); }
      .nb { white-space: nowrap; }
      .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      strong { font-weight: 600; color: var(--text); }

      /* silkscreen: small uppercase with air, for the few labels that name a control or a slot */
      .silk { font: 600 var(--t-label)/1.2 var(--cond); text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-2); }

      /* ---- the bar ---- */
      .bar { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color 160ms; }
      .bar.scrolled { border-bottom-color: var(--line); }
      .bar-in { display: flex; align-items: center; gap: 36px; height: var(--bar); }
      .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; font: 700 26px/1 var(--cond); letter-spacing: 0.01em; }
      .brand .mark { width: 22px; height: 22px; }
      .nav { display: flex; gap: 28px; margin-left: auto; }
      .nav a { text-decoration: none; color: var(--text-2); font: 500 17px/1 var(--cond); letter-spacing: 0.02em; padding: 8px 0; }
      .nav a:hover { color: var(--text); }

      /* ---- buttons: plain rounded rectangles, one orange primary ---- */
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border: 0; border-radius: var(--r-s);
        cursor: pointer; text-decoration: none; font: 700 20px/1 var(--cond); letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
      #landing .btn-1 { background: var(--accent); color: var(--on-accent); }
      #landing .btn-1:hover { background: #ff7140; }
      #landing .btn-1:active { background: #e94e16; }
      #landing .btn-1:disabled { background: transparent; color: var(--text-3); cursor: default; }
      #landing .btn-2 { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
      #landing .btn-2:hover { background: var(--pressed); }
      .btn-s { min-height: 38px; padding: 0 16px; font-size: 16px; }
      .link { font: inherit; color: var(--text); background: none; border: 0; padding: 0; cursor: pointer;
        text-decoration: underline; text-decoration-color: var(--text-3); text-decoration-thickness: 1px; text-underline-offset: 4px; }
      .link:hover { text-decoration-color: var(--text); }

      .h2 { font: 700 var(--t-2)/0.98 var(--cond); letter-spacing: -0.005em; }
      .h3 { font: 700 var(--t-3)/1.05 var(--cond); letter-spacing: 0.005em; }
      .lede { color: var(--text-2); max-width: 34em; }
      .lede strong { color: var(--text); }

      /* ---- the hero: the line, the action, then the video and the screenshots ---- */
      .hero { padding: 72px 0 0; }
      #landing h1, #landing-boot h1 { font: 700 var(--t-hero)/0.88 var(--cond); letter-spacing: -0.015em; color: var(--text); max-width: 9em; }
      .hero-row { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px 56px; align-items: end; margin-top: 36px; }
      .tag { font: 500 clamp(20px, 1.7vw, 24px)/1.4 var(--body); max-width: 24em; color: var(--text); }
      .go { display: grid; gap: 14px; justify-items: start; }
      .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
      .addr { font-size: var(--t-small); line-height: 1.4; color: var(--text-2); }
      .addr-url { font: 600 var(--t-small)/1.4 var(--body); color: var(--text); background: none; border: 0; padding: 0; cursor: copy;
        text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }
      .addr-url:hover { text-decoration-thickness: 3px; }
      .go-note { font-size: var(--t-small); line-height: 1.45; color: var(--text-2); max-width: 30em; min-height: 1.45em; }
      .xr-fail { color: var(--accent); font-weight: 600; font-size: var(--t-small); }

      /* the full stop is a hit: it lands on the beat (96 bpm), a ring closing onto it first */
      .beat { position: relative; display: inline-block; width: 0.15em; height: 0.15em; margin-left: 0.04em; vertical-align: baseline; }
      .beat::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--text); }
      .beat-ring { position: absolute; left: 50%; top: 50%; width: 0.42em; height: 0.42em; margin: -0.21em 0 0 -0.21em; overflow: visible; pointer-events: none; }
      .beat-ring circle { fill: none; stroke: var(--accent); stroke-width: 6; opacity: 0; transform-box: fill-box; transform-origin: center; }
      @media (prefers-reduced-motion: no-preference) {
        .beat::before { animation: thump 2.5s cubic-bezier(0.2, 0.8, 0.2, 1) 0.6s infinite; }
        .beat-ring .closing { animation: closing 2.5s linear 0.6s infinite; }
      }
      @keyframes closing { 0% { transform: scale(2.4); opacity: 0; } 12% { opacity: 1; } 50% { transform: scale(1); opacity: 1; } 51%, 100% { transform: scale(1); opacity: 0; } }
      @keyframes thump { 0%, 49.9% { transform: none; background: var(--text); } 50% { transform: scale(1.4); background: var(--accent); } 70%, 100% { transform: none; background: var(--text); } }

      /* ---- slots: the video and the screenshots. Filled when the file is there; until then a quiet empty slot ---- */
      /* (no screenshots yet: three small slots in a row; once one is in, the first is big and the others stack beside it) */
      .media { margin-top: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .media.has-shots { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
      .slot { position: relative; margin: 0; border-radius: var(--r); background: var(--raised); overflow: hidden; }
      .slot-video { grid-column: 1 / -1; aspect-ratio: 16 / 9; }
      /* (empty, the video's slot is a letterbox, so the page doesn't open on a big dark box) */
      .slot-video:not(.filled) { aspect-ratio: 21 / 8; max-height: 300px; }
      /* (no screenshots yet: their row stays out of the way until one is there) */
      .media:not(.has-shots) .shot { display: none; }
      .slot .fill { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; background: #000; }
      .slot.filled .fill { opacity: 1; }
      video.fill { object-fit: contain; }
      .slot.filled .empty { display: none; }
      .slot:not(.filled) .fill { pointer-events: none; }
      .shot { aspect-ratio: 16 / 9; }
      .has-shots .shot-1 { grid-row: span 2; aspect-ratio: auto; min-height: 100%; }
      /* the empty state: the slot's name and one line, nothing else */
      .empty { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 12px; text-align: center; padding: 24px; color: var(--text-2); }
      .empty .silk { display: inline-flex; align-items: center; gap: 8px; }
      .empty .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
      .empty p { font-size: var(--t-small); line-height: 1.4; max-width: 22em; }
      .shot .empty p { font-size: 15px; }
      .play-mark { width: 44px; height: 44px; }
      .play-mark path { fill: none; stroke: var(--text); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }

      /* ---- how to play: a real sequence, so numbered ---- */
      .how { padding-top: var(--sec); }
      /* (a step sequencer: three steps left to right, the number over each) */
      .how-in { display: grid; gap: 32px; }
      .steps { counter-reset: step; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
      .steps li { counter-increment: step; display: grid; align-content: start; gap: 18px; padding: 24px 32px 28px 0; font: 500 clamp(22px, 2vw, 27px)/1.3 var(--body); }
      .steps li + li { border-left: 1px solid var(--line); padding-left: 32px; }
      .steps li::before { content: counter(step); font: 700 clamp(40px, 3.4vw, 52px)/0.9 var(--cond); color: var(--accent); }
      .how-note { margin-top: 24px; color: var(--text-2); max-width: 36em; }

      /* ---- the instruments: a channel strip beside the desk drawing ---- */
      .play { padding-top: var(--sec); }
      .play-head { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 16px 56px; align-items: end; }
      .play-head .lede { max-width: 30em; }
      .deck { margin-top: 40px; display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); background: var(--raised); border-radius: var(--r); overflow: hidden; }
      .picker { display: grid; align-content: start; padding: 8px; gap: 2px; border-right: 1px solid var(--line); }
      .pick { position: relative; display: grid; gap: 4px; width: 100%; text-align: left; background: transparent; color: var(--text); border: 0; border-radius: var(--r-s);
        padding: 14px 16px 14px 20px; cursor: pointer; font: inherit; }
      .pick-name { font: 700 24px/1 var(--cond); letter-spacing: 0.01em; }
      .pick-line { font-size: 15px; line-height: 1.4; color: var(--text-2); }
      .pick:hover { background: color-mix(in srgb, var(--pressed) 60%, transparent); }
      .pick[aria-pressed='true'] { background: var(--pressed); }
      .pick[aria-pressed='true']::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 2px; background: var(--accent); }
      .pick[aria-pressed='true'] .pick-line { color: var(--text); }
      .desk { margin: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
      .stage { position: relative; background: var(--bg); margin: 8px 8px 0; border-radius: var(--r-s); touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
        display: grid; align-items: center; }
      .desk-svg { display: block; width: 100%; height: auto; max-height: 70vh; }
      .desk-svg [class^='m-'] { stroke: var(--i-edge); stroke-width: 1.5px; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
      .desk-svg .m-head { fill: var(--i-head); } .desk-svg .m-shell { fill: var(--i-shell); } .desk-svg .m-chrome { fill: var(--i-chrome); }
      .desk-svg .m-brass { fill: var(--i-brass); } .desk-svg .m-groove { fill: none; stroke: var(--i-groove); }
      .desk-svg .m-key { fill: var(--i-key); } .desk-svg .m-bkey { fill: var(--i-bkey); } .desk-svg .m-case { fill: var(--i-case); }
      .desk-svg .m-felt { fill: none; stroke: var(--i-felt); stroke-width: 5px; }
      .desk-svg .m-rosewood { fill: var(--i-rosewood); } .desk-svg .m-rail { fill: none; stroke: var(--i-rail); stroke-width: 7px; }
      .desk-svg .m-skin { fill: var(--i-skin); } .desk-svg .m-dash { fill: none; stroke: var(--i-skin-line); stroke-dasharray: 0.9 0.9; }
      .desk-svg .m-bronze { fill: var(--i-bronze); } .desk-svg .m-note { fill: var(--i-note); } .desk-svg .m-dimple { fill: none; stroke: var(--i-dimple); }
      .desk-svg .m-spruce { fill: var(--i-spruce); } .desk-svg .m-board { fill: var(--i-board); } .desk-svg .m-rosette { fill: none; stroke: var(--i-rosette); stroke-width: 4px; }
      .desk-svg .m-hole { fill: var(--i-hole); } .desk-svg .m-fret { fill: none; stroke: var(--i-chrome); stroke-width: 1px; }
      .desk-svg .m-string { fill: none; stroke: var(--i-string); stroke-width: 1px; } .desk-svg .m-string.wound { stroke-width: 2px; }
      .desk-svg .held { fill: var(--accent); stroke: var(--i-edge); stroke-width: 2px; vector-effect: non-scaling-stroke; }
      .stage.unfold .inst-pos > .inst { animation: unfold 240ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      .part, #landing .part:focus-visible { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--accent); fill-opacity: 0; stroke: none; pointer-events: none; }
      .part .glow > .band { fill: none; stroke: var(--accent); stroke-opacity: 0; }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill-opacity: 0.6; stroke-opacity: 0.6; } to { fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { stroke: var(--text); stroke-opacity: 1; stroke-width: 3px; vector-effect: non-scaling-stroke; }
      .part:focus-visible .glow > .band { stroke-width: 3px; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      /* the ring closing onto what's next (round for a drum, square for a key), as in the game */
      .close-ring { position: absolute; pointer-events: none; border: 2px solid var(--accent); border-radius: 4px; animation: close-in linear forwards; }
      .close-ring.round { border-radius: 50%; }
      @keyframes close-in { from { transform: scale(1.9); opacity: 0; } 25% { opacity: 1; } to { transform: scale(1); opacity: 1; } }
      /* the hit: a broken ring goes out from the point you hit, once */
      .hit-ring { position: absolute; width: 140px; height: 140px; margin: -70px 0 0 -70px; pointer-events: none; animation: ring 420ms cubic-bezier(0.1, 0.7, 0.3, 1) forwards; }
      .hit-ring svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .hit-ring circle { fill: none; stroke: var(--accent); }
      @keyframes ring { from { transform: scale(0.15); opacity: 1; } to { transform: scale(1); opacity: 0; } }
      .desk-foot { display: flex; flex-wrap: wrap; gap: 4px 24px; justify-content: space-between; padding: 14px 16px 16px; font-size: 15px; line-height: 1.45; color: var(--text-2); }
      .now-line { display: none; color: var(--text); }
      .about { min-height: 1.45em; }
      .how-hit { color: var(--text-3); }

      /* ---- songs: a track listing ---- */
      .songs-sec { padding-top: var(--sec); }
      .songs-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 32px 56px; align-items: start; }
      .songs-in .lede { margin-top: 20px; }
      .songs { columns: 2; column-gap: 40px; border-top: 1px solid var(--line); }
      .song { break-inside: avoid; display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; padding: 12px 0 11px; border-bottom: 1px solid var(--line); }
      .song .n { font: 600 15px/1 var(--cond); color: var(--text-2); }
      .song .name { font: 600 21px/1.15 var(--cond); letter-spacing: 0.01em; }
      .song .by { grid-column: 2; font-size: 14px; line-height: 1.3; color: var(--text-2); }
      .song .len { grid-column: 3; grid-row: 1 / span 2; align-self: center; font-size: 14px; color: var(--text-2); text-align: right; line-height: 1.3; }
      .song.orig .name::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: var(--accent); vertical-align: 0.2em; }
      .key { margin-top: 16px; font-size: 14px; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
      .key::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

      /* ---- make a track, play together: two panels of different weight ---- */
      .more { padding-top: var(--sec); }
      .more-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 16px; align-items: stretch; }
      .panel { background: var(--raised); border-radius: var(--r); padding: 36px; }
      .panel .h2 { font-size: clamp(36px, 3.6vw, 52px); }
      .panel p { margin-top: 16px; }
      .track p { color: var(--text-2); }
      .together .lede { color: var(--text); max-width: 32em; }
      .band-ctl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 32px; }
      .band-ctl > div { background: var(--bg); border-radius: var(--r-s); padding: 20px; display: grid; gap: 14px; align-content: start; }
      .band-ctl .h3 { font-size: 24px; }
      .band-ctl .hint { font-size: 15px; line-height: 1.4; color: var(--text-2); margin: -6px 0 0; }
      .join { display: flex; gap: 10px; align-items: stretch; }
      #band-code { flex: 1 1 auto; min-width: 0; width: 100%; font: 700 30px/1 var(--cond); letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); caret-color: var(--accent);
        background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-s); padding: 0 14px; min-height: 52px; }
      #band-code::placeholder { color: var(--text-3); }
      #landing #band-code:focus-visible { outline: 2px solid var(--text); outline-offset: 0; }
      #band-status { min-height: 1.5em; font-weight: 600; margin-top: 16px; margin-bottom: -8px; }
      .band-phone { display: none; margin-top: 24px; color: var(--text-2); }
      #landing[data-where='phone'] .band-ctl, #landing[data-where='phone'] #band-status { display: none; }
      #landing[data-where='phone'] .band-phone { display: block; }

      /* ---- settings ---- */
      .prep-sec { padding-top: 72px; }
      details.prep { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
      details.prep summary { list-style: none; display: flex; align-items: baseline; gap: 16px; cursor: pointer; padding: 18px 0; font: 700 24px/1.15 var(--cond); }
      details.prep summary::-webkit-details-marker { display: none; }
      details.prep summary small { font: 400 15px/1.4 var(--body); color: var(--text-2); }
      .pm { position: relative; flex: none; align-self: center; width: 28px; height: 28px; margin-left: auto; border-radius: var(--r-s); background: var(--raised); }
      .pm::before, .pm::after { content: ''; position: absolute; left: 8px; right: 8px; top: 13px; height: 2px; border-radius: 1px; background: var(--text); }
      .pm::after { transform: rotate(90deg); }
      details.prep[open] .pm::after { display: none; }
      details.prep summary:hover .pm { background: var(--pressed); }
      .opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 40px; margin: 8px 0 24px; font-size: var(--t-small); align-items: start; }
      .opts label { display: flex; gap: 12px; align-items: center; cursor: pointer; }
      .opts label.sel { flex-direction: column; align-items: flex-start; gap: 8px; cursor: default; }
      .range { display: flex; gap: 10px; align-items: center; }
      /* toggles: a plain track; on = the knob at the orange side */
      .opts input[type='checkbox'] { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 40px; height: 22px; margin: 0; border-radius: 11px; background: var(--pressed); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; transition: background-color 120ms; }
      .opts input[type='checkbox']::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--text-2); transition: transform 120ms, background-color 120ms; }
      .opts input[type='checkbox']:checked { background: var(--accent); box-shadow: none; }
      .opts input[type='checkbox']:checked::after { transform: translateX(18px); background: var(--on-accent); }
      .opts input[type='range'] { accent-color: var(--accent); width: 170px; }
      .opts select { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 10px; max-width: 100%; }
      .small-print { font-size: 15px; color: var(--text-2); margin: 4px 0 24px; }

      /* ---- about: a spec plate ---- */
      .foot { margin-top: var(--sec); padding: 0 0 72px; font-size: var(--t-small); line-height: 1.5; color: var(--text-2); }
      .foot .h2 { color: var(--text); }
      .foot-in { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 32px 56px; align-items: start; border-top: 1px solid var(--line); padding-top: 48px; }
      .maker { font: 500 22px/1.4 var(--body); color: var(--text); margin-top: 20px; max-width: 18em; }
      .plate { display: grid; grid-template-columns: 140px minmax(0, 1fr); border-top: 1px solid var(--line); }
      .plate dt, .plate dd { padding: 14px 0; border-bottom: 1px solid var(--line); }
      .plate dt { padding-top: 17px; }
      .plate dd { color: var(--text); }
      .plate dd.credit { color: var(--text-2); font-size: 15px; }

      @media (max-width: 1060px) {
        .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .nav { gap: 22px; }
      }
      /* tablet and phone */
      @media (max-width: 900px) {
        :root { --gut: 20px; --bar: 56px; --sec: 96px; }
        .nav { display: none; }
        .bar-in { justify-content: space-between; }
        .hero { padding-top: 40px; }
        .hero-row, .how-in, .play-head, .songs-in, .foot-in { grid-template-columns: minmax(0, 1fr); }
        .steps { grid-template-columns: minmax(0, 1fr); }
        .steps li, .steps li + li { grid-template-columns: 48px minmax(0, 1fr); gap: 0; align-items: baseline; padding: 20px 0; border-left: 0; border-bottom: 1px solid var(--line); }
        .steps li::before { font-size: 32px; }
        .media { margin-top: 44px; gap: 12px; }
        .media.has-shots { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .has-shots .shot-1 { grid-column: 1 / -1; grid-row: auto; aspect-ratio: 16 / 9; min-height: 0; }
        .deck { grid-template-columns: minmax(0, 1fr); }
        .picker { grid-template-columns: repeat(3, minmax(0, 1fr)); border-right: 0; border-bottom: 1px solid var(--line); gap: 4px; }
        .pick { padding: 14px 12px 16px; text-align: center; justify-items: center; }
        .pick-line { display: none; }
        .pick-name { font-size: 21px; }
        .pick[aria-pressed='true']::before { left: 14px; right: 14px; top: auto; bottom: 0; width: auto; height: 4px; }
        .now-line { display: block; }
        .more-in { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 640px) {
        /* (on a phone the hero's button is a screen away: no second copy in the bar) */
        #bar-enter { display: none; }
        :root { --gut: 16px; --sec: 80px; }
        .btn { padding: 0 22px; }
        .cta .btn { flex: 1 1 100%; }
        .media, .media.has-shots { grid-template-columns: minmax(0, 1fr); }
        .media:not(.has-shots) .shot { aspect-ratio: 5 / 2; }
        /* (on a phone, one empty screenshot slot stands for all of them) */
        .media:not(.has-shots) .shot:not(.shot-1) { display: none; }
        .slot-video:not(.filled) { aspect-ratio: 16 / 9; }

        .picker { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 6px; gap: 2px; }
        .pick { padding: 12px 4px 14px; }
        .pick-name { font-size: 19px; }
        .songs { columns: 1; }
        .panel { padding: 24px 20px; }
        .band-ctl { grid-template-columns: minmax(0, 1fr); }
        .opts { grid-template-columns: minmax(0, 1fr); }
        details.prep summary { flex-wrap: wrap; row-gap: 4px; }
        details.prep summary small { order: 3; flex-basis: 100%; }
        .plate { grid-template-columns: minmax(0, 1fr); }
        .plate dt { border-bottom: 0; padding-bottom: 0; }
        .plate dd { padding-top: 4px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage.unfold .inst-pos > .inst { animation: none; }
        .part.lit .glow > * { animation-duration: 1ms; }
        .hit-ring { animation: ring-still 400ms linear forwards; }
        .bar, .opts input[type='checkbox'], .opts input[type='checkbox']::after { transition: none; }
      }
      @keyframes ring-still { from { opacity: 1; } to { opacity: 0; } }

      /* the phone jam page (src/jam/phone.ts) */
      .jam { margin-top: 24px; border-top: 1px solid var(--line); padding-top: 16px; }
      .jam h2 { font: 700 24px/1.1 var(--cond); margin: 0 0 6px; }
      .jam-lede { color: var(--text-2); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 700 22px var(--cond); letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px; background: var(--raised); color: var(--text); border: 1px solid var(--line); border-radius: var(--r-s); }
      .jam-status { color: var(--text-2); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: var(--line); margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: var(--accent); } to { background: var(--line); } }
      .jam-song { color: var(--text-2); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 2px solid var(--accent); border-radius: 50%; background: var(--raised); color: var(--text); font: 600 16px var(--body); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { border-width: 4px; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <!-- the top of the page while the game loads (src/ui/landing.ts replaces it: keep the two in step) -->
    <div id="landing-boot">
      <header class="bar"><div class="wrap bar-in"><span class="brand"><svg class="mark" viewBox="-372 -372 744 744" aria-hidden="true"><circle class="mark-ring" r="170" stroke-width="92" stroke-dasharray="800 270" transform="rotate(-20)"/><circle class="mark-ring" r="330" stroke-width="64" stroke-dasharray="700 240 600 540" transform="rotate(30)"/><circle class="core" r="84"/></svg>Thump</span></div></header>
      <section class="hero">
        <div class="wrap">
          <h1>A band on your desk<span class="beat" aria-hidden="true"></span></h1>
          <div class="hero-row"><p class="tag">A VR music game you play with just your hands, no controllers, on your actual desk.</p></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
