<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Thump: a band on your desk. A music game for Meta Quest 3, played sitting down. Drums, a piano, a marimba, a guitar, congas and a handpan under your hands. Play songs or make a track, alone or with friends." />
    <meta property="og:title" content="Thump: a band on your desk" />
    <meta property="og:description" content="Drums, a piano, a marimba, a guitar, congas and a handpan on your desk, in mixed reality on Meta Quest 3. Hands only." />
    <meta property="og:url" content="https://or-6.github.io/thump/" />
    <meta name="theme-color" content="#e5e7e2" />
    <title>Thump: a band on your desk</title>
    <link rel="preload" href="./fonts/BarlowCondensed-Bold.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url(./fonts/BarlowCondensed-SemiBold.ttf) format('truetype'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url(./fonts/BarlowCondensed-Bold.ttf) format('truetype'); }
      :root {
        /* a pale grey page, a grey plastic tray, ink, and lacquer red for the one button */
        --page: #e5e7e2; --ink: #1a1b19; --soft: #4f524c; --dim: #6b6e67; --rule: #c8cbc4;
        --tray: #d2d5ce; --tray-lip: #bcc0b8; --red: #b42a1f; --red-deep: #8f1f16; --field: #f4f5f1;
        --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: var(--sans); }
      #scene-container { position: fixed; inset: 0; }

      /* the 2D page (src/ui/landing.ts) */
      #landing, #landing-boot { position: fixed; inset: 0; overflow-x: hidden; overflow-y: auto; background: var(--page); -webkit-font-smoothing: antialiased; }
      #landing[hidden] { display: none; }
      #landing *, #landing *::before, #landing *::after, #landing-boot * { box-sizing: border-box; }
      #landing [hidden] { display: none !important; }
      .page { max-width: 1240px; margin: 0 auto; padding: 0 40px; }
      .mast { display: flex; justify-content: space-between; align-items: baseline; padding: 26px 0 0; }
      .wordmark { font: 700 34px/1 var(--display); letter-spacing: -0.5px; }
      .for { font-size: 15px; color: var(--soft); }

      .hero { display: grid; grid-template-columns: minmax(300px, 5fr) 7fr; gap: 56px; align-items: start; padding: 64px 0 72px; }
      h1 { font: 700 clamp(64px, 7.4vw, 100px)/0.9 var(--display); letter-spacing: -1.5px; margin: 0 0 28px; text-wrap: balance; }
      .lede { font-size: 19px; line-height: 1.55; color: #2c2e2a; margin: 0 0 32px; max-width: 34em; }
      .enter { font: 700 26px/1 var(--display); letter-spacing: 0.2px; color: #fff; background: var(--red); border: 0; border-radius: 10px; padding: 18px 28px 17px; cursor: pointer;
        box-shadow: inset 0 -3px 0 var(--red-deep); }
      .enter:hover { background: #a3251b; }
      .enter:active { transform: translateY(1px); box-shadow: inset 0 -1px 0 var(--red-deep); }
      .go-note { font-size: 15px; color: var(--soft); margin: 12px 0 0; }
      .xr-fail { color: var(--red); font-weight: 600; margin: 12px 0 0; }
      .quest { font-size: 17px; line-height: 1.5; margin: 0 0 4px; color: var(--soft); }
      .url-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin: 0; }
      .url { font: 700 clamp(30px, 3.2vw, 40px)/1.1 var(--display); letter-spacing: -0.2px; white-space: nowrap; }
      .plain { font: 600 20px/1 var(--display); color: var(--ink); background: var(--field); border: 1.5px solid var(--ink); border-radius: 8px; padding: 11px 18px 10px; cursor: pointer; }
      .plain:hover { background: #fff; }
      .plain:active { transform: translateY(1px); }

      .desk { margin: 0; }
      .picker { display: flex; flex-wrap: wrap; gap: 4px 22px; margin: 0 0 14px; }
      .pick { font: 600 23px/1 var(--display); color: var(--dim); background: none; border: 0; padding: 6px 0 7px; cursor: pointer; border-bottom: 3px solid transparent; }
      .pick:hover { color: var(--ink); }
      .pick[aria-pressed='true'] { color: var(--ink); border-bottom-color: var(--light); }
      .stage { touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
      .desk-svg { display: block; width: 100%; height: auto; }
      .stage.unfold .inst { animation: unfold 260ms cubic-bezier(.2, .8, .2, 1); transform-origin: 50% 50%; transform-box: fill-box; }
      @keyframes unfold { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
      .part { cursor: pointer; outline: none; }
      .part .glow > * { fill: var(--light); fill-opacity: 0; stroke: var(--light); stroke-opacity: 0; pointer-events: none; }
      .part .glow > :not([fill='none']) { stroke-width: 0.35; }
      .part .glow > [fill='none'] { fill: none; }
      .part.lit .glow > * { animation: lit 420ms ease-out; }
      @keyframes lit { from { fill-opacity: 0.75; stroke-opacity: 0.75; } to { fill-opacity: 0; stroke-opacity: 0; } }
      .part:focus-visible .glow > * { stroke: var(--ink); stroke-opacity: 1; stroke-width: 0.35; }
      .part .held { opacity: 0; transition: opacity 120ms; }
      .part.on .held { opacity: 1; }
      .desk-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; font-size: 13px; color: var(--dim); }
      .scale { display: flex; align-items: center; gap: 8px; flex: 0 0 40%; justify-content: flex-end; }
      .scale-bar { display: block; height: 7px; border: 1.5px solid var(--dim); border-top: 0; flex: none; }
      figcaption { margin-top: 18px; max-width: 40em; }
      .about { font-size: 17px; line-height: 1.55; margin: 0 0 6px; min-height: 3.1em; }
      .try { font-size: 15px; color: var(--soft); margin: 0; }

      main > .row { display: grid; grid-template-columns: 5fr 7fr; gap: 56px; padding: 36px 0; border-top: 1.5px solid var(--rule); }
      h2 { font: 700 34px/1 var(--display); letter-spacing: -0.3px; margin: 0; }
      .row-body { max-width: 38em; font-size: 17px; line-height: 1.6; }
      .row-body > p { margin: 0 0 14px; }
      .row-words h2 { margin-bottom: 14px; }
      .row-words p { font-size: 16px; line-height: 1.6; margin: 0; max-width: 30em; }
      #together .row-body { align-self: center; }
      #together .band { margin-top: 0; }
      details.prep[open] summary { margin-bottom: 4px; }
      main > .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 48px; padding: 36px 0 44px; border-top: 1.5px solid var(--rule); }
      .col h2 { margin-bottom: 14px; }
      .col-body { font-size: 16px; line-height: 1.6; }
      .col-body > p { margin: 0; }
      .band { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; margin: 22px 0 10px; }
      .or { color: var(--soft); }
      .join { display: inline-flex; gap: 8px; }
      .setlist { list-style: none; margin: 20px 0 0; padding: 0; max-width: 24em; }
      .setlist li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 7px 0 6px; border-bottom: 1px solid var(--rule); }
      .setlist .song { font: 600 22px/1.1 var(--display); }
      .setlist .bpm { font-size: 15px; color: var(--soft); font-variant-numeric: tabular-nums; }
      #band-code { width: 5.6em; font: 700 22px/1 var(--display); letter-spacing: 5px; text-transform: uppercase; text-align: center; color: var(--ink); background: var(--field);
        border: 1.5px solid var(--ink); border-radius: 8px; padding: 9px 6px 8px 11px; }
      #band-code::placeholder { color: #9a9d95; }
      #band-status { min-height: 1.6em; font-weight: 600; margin: 0; }
      details.prep { margin-top: 0; }
      details.prep summary { font: 700 22px/1 var(--display); cursor: pointer; padding: 6px 0; width: max-content; }
      .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 28px; margin: 14px 0; font-size: 16px; }
      .opts label { display: flex; gap: 10px; align-items: center; }
      .opts label.sel { flex-direction: column; align-items: flex-start; gap: 6px; }
      .range { display: flex; gap: 10px; align-items: center; }
      .opts input[type='checkbox'] { width: 19px; height: 19px; margin: 0; flex: none; accent-color: var(--red); }
      .opts input[type='range'] { accent-color: var(--red); width: 160px; }
      .opts select { font: inherit; color: var(--ink); background: var(--field); border: 1.5px solid var(--ink); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
      .small-print { font-size: 15px; color: var(--soft); margin: 8px 0 0; }
      .link { font: inherit; color: var(--red); background: none; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
      .foot { border-top: 1.5px solid var(--rule); padding: 22px 0 40px; font-size: 14px; color: var(--soft); }
      #landing button:focus-visible, #landing input:focus-visible, #landing select:focus-visible, #landing summary:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

      @media (max-width: 900px) {
        .page { padding: 0 16px; }
        .mast { padding-top: 18px; }
        .wordmark { font-size: 28px; }
        .for { font-size: 14px; }
        .hero { grid-template-columns: 1fr; gap: 36px; padding: 32px 0 44px; }
        h1 { font-size: clamp(56px, 17vw, 84px); margin-bottom: 20px; }
        .lede { font-size: 17px; margin-bottom: 24px; }
        .picker { display: grid; grid-template-columns: repeat(3, max-content); gap: 2px 22px; }
        .pick { font-size: 22px; justify-self: start; }
        main > .row { grid-template-columns: 1fr; gap: 14px; padding: 28px 0; }
        main > .trio { grid-template-columns: 1fr; gap: 32px; padding: 28px 0 32px; }
        .band { flex-direction: column; align-items: flex-start; gap: 10px; margin-top: 18px; }
        .col-body, .row-words p { font-size: 17px; }
        h2 { font-size: 30px; }
        .opts { grid-template-columns: 1fr; }
        .about { min-height: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .stage.unfold .inst { animation: none; }
        .part.lit .glow > * { animation-duration: 1ms; }
      }

      /* the phone jam page (src/jam/phone.ts) */
      .jam { margin-top: 26px; border-top: 1.5px solid var(--rule); padding-top: 18px; }
      .jam h2 { font-size: 24px; margin: 0 0 6px; }
      .jam-lede { color: var(--soft); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 700 22px var(--display); letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px; background: var(--field); color: var(--ink); border: 1.5px solid var(--ink); border-radius: 8px; }
      .jam-status { color: var(--soft); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: #c8cbc4; margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: #2ad1b5; box-shadow: 0 0 18px #2ad1b5; } to { background: #c8cbc4; box-shadow: none; } }
      .jam-song { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #3a3d40, #1d1f21); color: #e5e7e2; box-shadow: 0 0 0 2px #2ad1b5; font: 600 16px var(--sans); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { box-shadow: 0 0 0 4px #2ad1b5, 0 0 24px #2ad1b5; }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <!-- the top of the page while the game loads (src/ui/landing.ts replaces it: keep the two in step) -->
    <div id="landing-boot">
      <div class="page">
        <header class="mast"><span class="wordmark">Thump</span><span class="for">For Meta Quest 3</span></header>
        <div class="hero">
          <div class="pitch">
            <h1>A band on your desk.</h1>
            <p class="lede">A music game for Meta Quest 3, played sitting down. Tap your desk or a tray table and a drum kit comes up under your hands. Swap it for a piano, a marimba, a guitar, congas or a handpan. Every note is in the scale, so there's no wrong one.</p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
