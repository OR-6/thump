<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Thump: a hands-first mixed-reality music game for Meta Quest. Every surface in your room is an instrument: your table a drum kit, your door a marimba, your window a glockenspiel." />
    <meta property="og:title" content="Thump: play your room" />
    <meta property="og:description" content="Every surface in your room is an instrument. Hit anything." />
    <meta property="og:url" content="https://or-6.github.io/thump/" />
    <meta name="theme-color" content="#0d0d0f" />
    <title>Thump</title>
    <style>
      @font-face { font-family: 'Barlow Condensed'; font-weight: 600; font-display: swap; src: url(./fonts/BarlowCondensed-SemiBold.ttf) format('truetype'); }
      @font-face { font-family: 'Barlow Condensed'; font-weight: 700; font-display: swap; src: url(./fonts/BarlowCondensed-Bold.ttf) format('truetype'); }
      :root {
        --bg: #0d0d0f; --panel: #151518; --edge: #26262b; --ink: #f2efe6; --soft: #a8a49b; --dim: #6c6a65;
        --accent: #ff5a3c; --accent-deep: #c9402a;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
      #scene-container { position: fixed; inset: 0; }
      #landing { position: fixed; inset: 0; overflow: auto; padding: 48px 16px; box-sizing: border-box;
        background: radial-gradient(1200px 600px at 50% -10%, #1d1d22, var(--bg)); }
      #landing[hidden] { display: none; }
      #landing *, #landing *::before, #landing *::after { box-sizing: border-box; }
      /* a concert programme: a printed card with a double rule, set in one condensed face */
      .sheet { max-width: 560px; margin: 0 auto; padding: 40px 44px 30px; border-radius: 3px; background: #121214;
        box-shadow: inset 0 0 0 8px #121214, inset 0 0 0 9px #3a3833, 0 30px 60px #0009; font-family: 'Barlow Condensed', var(--sans); }
      .mast { text-align: center; }
      .kicker { font-size: 15px; letter-spacing: 4px; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; font-weight: 600; }
      h1 { font-family: 'Barlow Condensed', var(--sans); font-weight: 700; font-size: 92px; line-height: 0.9; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
      .tag { font-size: 22px; margin: 6px 0 0; color: var(--soft); font-weight: 600; letter-spacing: 0.5px; }
      .bill { list-style: none; padding: 0; margin: 28px 0 0; display: grid; gap: 6px; font-size: 21px; }
      .bill li { display: flex; align-items: baseline; gap: 8px; }
      .bill .who { color: #dcd8cf; }
      .bill i { flex: 1; border-bottom: 2px dotted #4a4740; transform: translateY(-5px); }
      .bill .what { color: var(--c); font-weight: 600; }
      .conductor { text-align: center; font-size: 17px; color: var(--soft); margin: 18px 0 0; letter-spacing: 1.5px; text-transform: uppercase; }
      .lede { font: 400 17px/1.55 var(--sans); margin: 22px 0 24px; color: #cfcbc2; }
      .go { text-align: center; }
      .note, .opts, .quest, .small-print, .foot, .jam { font-family: var(--sans); }
      .patch { font: 700 22px 'Barlow Condensed', var(--sans); letter-spacing: 1px; text-transform: uppercase; color: #fff; background: var(--accent); border: 0; cursor: pointer; padding: 15px 26px; border-radius: 10px; }
      .patch:hover { background: #ff6b50; }
      .patch:active { transform: translateY(1px); }
      .patch:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
      .patch.small { font-size: 15px; padding: 10px 16px; }
      .note { font-size: 14px; color: var(--soft); margin: 14px 0 0; line-height: 1.5; }
      .xr-fail { color: #ff8f7a; font-weight: 600; margin: 12px 0 0; }
      .quest { font-size: 16px; line-height: 1.5; margin: 0 0 12px; color: #dcd8cf; }
      .url { font-family: ui-monospace, Menlo, monospace; background: #0e0e10; border: 1px solid var(--edge); padding: 2px 6px; border-radius: 5px; }
      details.prep { margin-top: 28px; border-top: 1px solid var(--edge); padding-top: 14px; }
      details.prep summary { font-size: 16px; font-weight: 600; color: var(--ink); cursor: pointer; }
      .opts { display: grid; gap: 11px; margin-top: 14px; font-size: 15px; color: #dcd8cf; }
      .opts label { display: flex; gap: 10px; align-items: center; }
      .opts input[type='checkbox'] { width: 18px; height: 18px; accent-color: var(--accent); }
      .opts select, .opts input[type='range'] { font: inherit; accent-color: var(--accent); }
      .opts select { background: #0e0e10; color: var(--ink); border: 1px solid var(--edge); border-radius: 6px; padding: 4px 6px; }
      .small-print { font-size: 13px; color: var(--dim); margin: 4px 0 0; }
      .link { font: inherit; color: #ff8f7a; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; }
      .foot { margin-top: 24px; font-size: 12px; color: var(--dim); }
      .jam { margin-top: 26px; border-top: 1px solid var(--edge); padding-top: 18px; }
      .jam h2 { font-size: 18px; margin: 0 0 6px; }
      .jam-lede { color: var(--soft); font-size: 15px; margin: 0 0 12px; }
      .jam-join { display: flex; gap: 10px; }
      #jam-code { font: 600 22px ui-monospace, Menlo, monospace; letter-spacing: 6px; text-transform: uppercase; width: 8.5ch; padding: 8px 10px;
        background: #0e0e10; color: var(--ink); border: 1px solid var(--edge); border-radius: 8px; }
      .jam-status { color: var(--soft); font-size: 14px; min-height: 1.2em; }
      .jam-pads { text-align: center; }
      .jam-light { width: 18px; height: 18px; border-radius: 50%; background: #2a2a2e; margin: 6px auto 4px; }
      .jam-light.pulse { animation: jamPulse 0.25s ease-out; }
      @keyframes jamPulse { from { background: #2ad1b5; box-shadow: 0 0 18px #2ad1b5; } to { background: #2a2a2e; box-shadow: none; } }
      .jam-song { color: var(--soft); font-size: 14px; margin: 0 0 12px; }
      .jam-row { display: flex; gap: 12px; justify-content: center; align-items: center; touch-action: none; }
      .jam-pad { border: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #2c2c31, #141417); color: var(--soft);
        box-shadow: inset 0 0 0 3px #26262b, 0 0 0 2px #2ad1b5; font: 600 16px var(--sans); cursor: pointer; }
      .jam-pad.big { width: 170px; height: 170px; font-size: 20px; }
      .jam-pad.small { width: 86px; height: 86px; }
      .jam-pad.hit { box-shadow: inset 0 0 0 3px #26262b, 0 0 0 4px #2ad1b5, 0 0 24px #2ad1b5; }
      @media (max-width: 520px) {
        #landing { padding: 16px; }
        .sheet { padding: 26px 20px 20px; }
        h1 { font-size: 64px; }
        .tag { font-size: 19px; }
        .bill { font-size: 18px; }
        .lede { font-size: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
